<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATABASE CALON NASABAH TPFX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3158d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="pwa-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="tpfxlogo.jpg">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--ink:#192238;--mut:#758096;--line:#e8ebf2;--pri:#3158d8;--soft:#f0f4ff;--shadow:0 8px 26px rgba(30,45,80,.055);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto;padding:12px 20px;border-bottom:1px solid rgba(232,235,242,.9);background:rgba(255,255,255,.94);backdrop-filter:blur(14px)}
.app-brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.app-brand-mark{width:116px;height:40px;display:block;flex:none;border-radius:8px;object-fit:cover;background:#fff}
.app-brand-copy b,.app-brand-copy span{display:block;white-space:nowrap}
.app-brand-copy b{font-size:14px;line-height:1.2}
.app-brand-copy span{margin-top:2px;color:var(--mut);font-size:10.5px}
.top-actions{display:flex;align-items:center;gap:8px}
.top-link,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:10px 14px;border-radius:13px;text-decoration:none;font-weight:700}
.top-link{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn{border:0;background:var(--pri);color:#fff;box-shadow:0 5px 14px rgba(39,67,214,.16)}
.btn.wa{background:#168a55;color:#fff}
main{max-width:900px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.sub{margin-top:5px;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{position:sticky;top:64px;z-index:2;margin:0 -2px 12px;padding:10px 2px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
.prog{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:3px 0 8px}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.stat{font-size:12px;color:var(--mut);margin-bottom:9px}
input[type=search],input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:12px 13px;font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-top:9px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pri);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:var(--shadow)}
.item.done{background:#fbfcff}
.item-copy{min-width:0}
.no{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.tel{font-weight:800;font-size:19px;letter-spacing:.2px;margin-top:3px}
.wa{grid-row:1/3;grid-column:2;min-width:112px}
.item select{grid-column:1/3}
.section-title{margin:10px 0 11px;font-size:15px;font-weight:800}
details{margin-top:14px}
summary{cursor:pointer;font-weight:700}
textarea{display:block;margin-top:9px;min-height:100px;resize:vertical}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.status-message{margin:8px 0 12px;color:var(--mut)}
.status-message.error{color:#b42318}
.retry{margin-top:8px}
@media(max-width:620px){.app-topbar{padding:9px 12px;gap:8px}.app-brand{gap:7px}.app-brand-mark{width:76px;height:30px}.app-brand-copy b{font-size:11px}.app-brand-copy span{display:none}.top-actions{gap:6px}.top-link,.btn{min-height:36px;padding:8px 10px;font-size:12px;border-radius:11px}main{padding:18px 12px calc(30px + env(safe-area-inset-bottom,0px))}.page-heading{align-items:flex-start}.page-heading h1{font-size:21px}.bar{top:50px}.item{padding:13px;border-radius:16px}.tel{font-size:17px}.wa{min-width:94px;padding:10px}.tabs{margin-right:-12px;padding-right:12px}}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style></head><body>
<header class="app-topbar">
<a class="app-brand" href="index.html" aria-label="Kembali ke TPFX Sales Workspace">
<img class="app-brand-mark" src="tpfxlogo.jpg" alt="Logo TPFX">
<span class="app-brand-copy"><b>Sales Workspace</b><span>Team community</span></span>
</a>
<div class="top-actions"><a class="top-link" href="index.html">← Workspace</a></div>
</header>
<main>
<div class="page-heading">
<div><h1>Database Calon Nasabah</h1><div class="sub">Pilih BDO, cari calon nasabah, lalu hubungi lewat WhatsApp.</div></div>
<span class="chip" aria-label="Database publik">Database</span>
</div>
<div class="tabs" id="tabs" role="tablist" aria-label="Pilih BDO"></div>
<section class="card bar" aria-label="Cari dan filter kontak">
<div class="prog" aria-hidden="true"><i id="pb"></i></div><div class="stat" id="stat"></div>
<input type="search" id="q" placeholder="Cari nomor atau pekerjaan" aria-label="Cari">
<div class="chips" id="chips"></div>
<details><summary>Ubah pesan pembuka WhatsApp</summary><textarea id="tpl" aria-label="Pesan pembuka"></textarea></details>
</section>
<div id="statusMessage" class="status-message mut" role="status">Memuat database...</div>
<h2 class="section-title">Daftar kontak</h2>
<div id="list"></div>
</main>
<script>
let DATA=[];
const ST=["Belum dihubungi","Sudah dichat","Menunggu balasan","Tertarik","Tidak tertarik","Closing"];
const DEF="Halo, selamat siang. Saya {bdo} dari TPFX. Boleh minta waktu sebentar untuk memperkenalkan peluang investasi dari kami?";
const API="https://script.google.com/macros/s/AKfycbwCiMQjyvd_GHqc-TOzofoDEcpOj_-_uxs2ciX4wZG7VuG3hoZlInRuyO3cmPxSWS6F/exec";
let cur=0,job="Semua",mem={};
const K="tpfx-v1";
try{mem=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}};
mem.tpl=mem.tpl||DEF;mem.s=mem.s||{};
const $=id=>document.getElementById(id);
async function rpc(fn,...args){
 const response=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),cache:"no-store"});
 if(!response.ok)throw new Error("Server HTTP "+response.status);
 const payload=await response.json();
 if(payload.error)throw new Error(payload.error);
 if(!Object.prototype.hasOwnProperty.call(payload,"result"))throw new Error("Endpoint "+fn+" tidak mengembalikan hasil.");
 return payload.result;
}
async function loadDatabase(){
 const status=$("statusMessage");
 status.className="status-message mut";
 status.textContent="Memuat database...";
 try{
  const result=await rpc("publicDatabaseData");
  if(result&&result.err){
   throw new Error(typeof result.err==="string"?result.err:"Database tidak dapat dimuat");
  }
  if(!result||!Array.isArray(result.rows)||!result.rows.every(d=>d&&typeof d.n==="string"&&Array.isArray(d.r)&&d.r.every(r=>Array.isArray(r)&&r.length>=3))){
   throw new Error("Data database dari server tidak valid");
  }
  DATA=result.rows;
  status.hidden=DATA.length>0;
  if(!DATA.length)status.textContent="Belum ada kontak yang disetujui untuk ditampilkan.";
  startDatabase();
 }catch(e){
  status.className="status-message error";
  status.replaceChildren(document.createTextNode("Database gagal dimuat: "+String(e&&e.message||e)+" "));
  const retry=document.createElement("button");
  retry.className="btn retry";
  retry.textContent="Coba lagi";
  retry.onclick=loadDatabase;
  status.appendChild(retry);
 }
}
function digits(n){return String(n||"").replace(/\D/g,"")}
function fmt(n){
 const value=digits(n);
 if(value.length<6)return String(n||"");
 return "+"+value.slice(0,2)+" "+value.slice(2,5)+"-"+value.slice(5,9)+"-"+value.slice(9);
}
function tabs(){
 $("tabs").replaceChildren();
 DATA.forEach((d,i)=>{
  const b=document.createElement("button");
  b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i==cur);
  b.textContent=d.n.split(" ").slice(0,2).join(" ");
  b.onclick=()=>{cur=i;job="Semua";render()};
  $("tabs").appendChild(b);
 });
}
function render(){
 if(!DATA.length){
  const empty=document.createElement("div");empty.className="card empty";empty.textContent="Belum ada kontak yang disetujui untuk ditampilkan.";
  $("list").replaceChildren(empty);return;
 }
 if(cur>=DATA.length)cur=0;
 const d=DATA[cur],jobs=["Semua",...new Set(d.r.map(r=>String(r[1]||"")))];
 if(!jobs.includes(job))job="Semua";
 $("chips").replaceChildren();
 jobs.forEach(j=>{
  const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",j==job);b.textContent=j;
  b.onclick=()=>{job=j;render()};$("chips").appendChild(b);
 });
 const key=r=>cur+"-"+r[0],st=r=>Number(mem.s[key(r)])||0;
 const done=d.r.filter(r=>st(r)>0).length;
 $("pb").style.width=(d.r.length?done/d.r.length*100:0)+"%";
 $("stat").textContent=done+" dari "+d.r.length+" kontak sudah diproses";
 const q=$("q").value.trim().toLowerCase();
 const rows=d.r.filter(r=>(job=="Semua"||String(r[1])==job)&&(String(r[1])+" "+String(r[2])).toLowerCase().includes(q));
 const list=$("list");list.replaceChildren();
 if(!rows.length){const empty=document.createElement("div");empty.className="card empty";empty.textContent="Tidak ada kontak yang cocok.";list.appendChild(empty);return}
 rows.forEach(r=>{
  const phone=digits(r[2]);
  const el=document.createElement("article");el.className="item"+(st(r)>0?" done":"");
  const copy=document.createElement("div");copy.className="item-copy";
  const number=document.createElement("div");number.className="no";number.textContent="No. "+String(r[0])+" · "+String(r[1]);
  const tel=document.createElement("div");tel.className="tel";tel.textContent=fmt(phone);
  copy.append(number,tel);
  const wa=document.createElement("a");wa.className="btn wa";wa.target="_blank";wa.rel="noopener noreferrer";wa.href="https://wa.me/"+phone+"?text="+encodeURIComponent(mem.tpl.replace("{bdo}",d.n));wa.textContent="Chat WA";
  wa.addEventListener("click",()=>{if(!st(r)){mem.s[key(r)]=1;save();el.classList.add("done");setTimeout(render,400)}});
  const s=document.createElement("select");s.setAttribute("aria-label","Status kontak "+String(r[0]));
  ST.forEach((t,i)=>{const o=new Option(t,i);o.selected=i==st(r);s.add(o)});
  s.onchange=()=>{mem.s[key(r)]=+s.value;save();render()};
  el.append(copy,wa,s);list.appendChild(el);
 });
}
function startDatabase(){
 $("tpl").value=mem.tpl;
 $("tpl").oninput=e=>{mem.tpl=e.target.value||DEF;save();render()};
 $("q").oninput=render;
 render();
}
loadDatabase();
</script></body></html>
