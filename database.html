<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATABASE CALON NASABAH TPFX</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212e;--mut:#5d6b78;--line:#dde3e8;--acc:#0b6b5c;--accink:#fff;--chip:#e6ecef;--ok:#0b6b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--card:#16212b;--ink:#e8eef2;--mut:#90a0ad;--line:#26343f;--acc:#2fbf9f;--accink:#06231d;--chip:#1f2d38;--ok:#2fbf9f}}
:root[data-theme="dark"]{--bg:#0e161d;--card:#16212b;--ink:#e8eef2;--mut:#90a0ad;--line:#26343f;--acc:#2fbf9f;--accink:#06231d;--chip:#1f2d38;--ok:#2fbf9f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{padding:18px 16px 10px;max-width:640px;margin:0 auto}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;max-width:640px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{max-width:640px;margin:0 auto;padding:0 16px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 8px;z-index:2}
.prog{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:2px 0 6px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stat{font-size:13px;color:var(--mut);margin-bottom:8px}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.item.done{opacity:.72}
.no{color:var(--mut);font-size:12px}
.tel{font-weight:700;font-size:17px;letter-spacing:.3px}
.job{font-size:13px;color:var(--mut)}
.wa{grid-row:1/3;grid-column:2;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:700;border-radius:10px;padding:12px 16px;text-align:center}
select{grid-column:1/3;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font:inherit;font-size:14px}
details{margin-top:10px;font-size:13px;color:var(--mut)}
summary{cursor:pointer}
textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;min-height:84px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
#gate{max-width:640px;margin:20px auto;padding:24px}
#gate .auth-link,#gate button{display:inline-block;margin:8px 4px 0;padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<div id="gate" class="empty" role="status">Memeriksa sesi login...</div>
<div id="protected" hidden>
<header><h1>DATABASE CALON NASABAH TPFX</h1><div class="sub">Pilih nama BDO, lalu ketuk tombol WhatsApp untuk menghubungi.</div></header>
<div class="tabs" id="tabs" role="tablist"></div>
<main>
<div class="bar"><div class="prog"><i id="pb"></i></div><div class="stat" id="stat"></div>
<input type="search" id="q" placeholder="Cari nomor atau pekerjaan" aria-label="Cari">
<div class="chips" id="chips"></div></div>
<details><summary>Ubah pesan pembuka</summary><textarea id="tpl" aria-label="Pesan pembuka"></textarea></details>
<div id="list"></div>
</main>
</div>
<script>
let DATA=[];
const ST=["Belum dihubungi","Sudah dichat","Menunggu balasan","Tertarik","Tidak tertarik","Closing"];
const DEF="Halo, selamat siang. Saya {bdo} dari TPFX. Boleh minta waktu sebentar untuk memperkenalkan peluang investasi dari kami?";
const API="https://script.google.com/macros/s/AKfycbwCiMQjyvd_GHqc-TOzofoDEcpOj_-_uxs2ciX4wZG7VuG3hoZlInRuyO3cmPxSWS6F/exec";
let TOKEN="";
let cur=0,job="Semua",mem={};
const K="tpfx-v1";
try{mem=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}};
mem.tpl=mem.tpl||DEF;mem.s=mem.s||{};
const $=id=>document.getElementById(id);
async function rpc(fn,...args){
 const response=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),cache:"no-store"});
 const payload=await response.json();
 if(!response.ok)throw new Error("Server HTTP "+response.status);
 if(payload.error)throw new Error(payload.error);
 return payload.result;
}
function showGate(message,login=false,retry=false){
 const gate=$("gate");gate.replaceChildren();
 const text=document.createElement("p");text.textContent=message;gate.appendChild(text);
 if(login){const link=document.createElement("a");link.className="auth-link";link.href="index.html";link.textContent="Login";gate.appendChild(link)}
 if(retry){const button=document.createElement("button");button.textContent="Coba lagi";button.onclick=loadDatabase;gate.appendChild(button)}
 gate.hidden=false;$("protected").hidden=true;
}
function clearSession(){
 TOKEN="";DATA=[];
 try{localStorage.removeItem("swt");localStorage.removeItem("swt_user")}catch(e){}
}
async function loadDatabase(){
 showGate("Memeriksa sesi login...");
 try{TOKEN=localStorage.getItem("swt")||""}catch(e){showGate("Browser tidak mengizinkan akses sesi login.");return}
 if(!TOKEN){showGate("Silakan login terlebih dahulu untuk membuka database.",true);return}
 try{
  const result=await rpc("databaseData",TOKEN);
  if(result&&result.err){
   if(result.err==="AUTH"){clearSession();showGate("Sesi login tidak valid atau sudah berakhir. Silakan login kembali.",true);return}
   throw new Error(typeof result.err==="string"?result.err:"Akses database ditolak");
  }
  if(!result||!Array.isArray(result.rows)||!result.rows.every(d=>d&&typeof d.n==="string"&&Array.isArray(d.r)&&d.r.every(r=>Array.isArray(r)&&r.length>=3))){
   throw new Error("Data database dari server tidak valid");
  }
  DATA=result.rows;
  $("protected").hidden=false;$("gate").hidden=true;
  startDatabase();
 }catch(e){
  showGate("Database gagal dimuat: "+String(e&&e.message||e),false,true);
 }
}
async function verifySession(){
 if(!TOKEN)return;
 try{
  const result=await rpc("checkSession",TOKEN);
  if(!result||result.err||result.ok!==1){
   const expired=!!(result&&result.err==="AUTH");
   clearSession();
   showGate(expired?"Sesi login tidak valid atau sudah berakhir. Silakan login kembali.":"Tidak dapat memverifikasi sesi login.",expired,!expired);
  }
 }catch(e){
  clearSession();showGate("Tidak dapat memverifikasi sesi login. Silakan coba lagi.",false,true);
 }
}
window.addEventListener("storage",e=>{if(e.key==="swt"&&e.newValue!==TOKEN)location.reload()});
window.addEventListener("pageshow",verifySession);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")verifySession()});
setInterval(verifySession,5*60*1000);
function fmt(n){return "+"+n.slice(0,2)+" "+n.slice(2,5)+"-"+n.slice(5,9)+"-"+n.slice(9)}
function tabs(){$("tabs").innerHTML="";DATA.forEach((d,i)=>{const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i==cur);b.textContent=d.n.split(" ").slice(0,2).join(" ");b.onclick=()=>{cur=i;job="Semua";render()};$("tabs").appendChild(b)})}
function render(){
 tabs();const d=DATA[cur],jobs=["Semua",...new Set(d.r.map(r=>r[1]))];
 $("chips").innerHTML="";jobs.forEach(j=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",j==job);b.textContent=j;b.onclick=()=>{job=j;render()};$("chips").appendChild(b)});
 const key=r=>cur+"-"+r[0],st=r=>mem.s[key(r)]||0;
 const done=d.r.filter(r=>st(r)>0).length;
 $("pb").style.width=(done/d.r.length*100)+"%";$("stat").textContent=done+" dari "+d.r.length+" kontak sudah diproses";
 const q=$("q").value.toLowerCase();
 const rows=d.r.filter(r=>(job=="Semua"||r[1]==job)&&(r[1]+r[2]).toLowerCase().includes(q));
 const L=$("list");L.innerHTML="";
 if(!rows.length){L.innerHTML='<div class="empty">Tidak ada kontak yang cocok.</div>';return}
 rows.forEach(r=>{
  const el=document.createElement("div");el.className="item"+(st(r)>0?" done":"");
  const msg=encodeURIComponent(mem.tpl.replace("{bdo}",d.n));
  el.innerHTML='<div><div class="no">No. '+r[0]+' · '+r[1]+'</div><div class="tel">'+fmt(r[2])+'</div></div><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+r[2]+'?text='+msg+'">Chat WA</a>';
  const s=document.createElement("select");s.setAttribute("aria-label","Status");
  ST.forEach((t,i)=>{const o=new Option(t,i);o.selected=i==st(r);s.add(o)});
  s.onchange=()=>{mem.s[key(r)]=+s.value;save();render()};
  el.querySelector(".wa").onclick=()=>{if(!st(r)){mem.s[key(r)]=1;save();setTimeout(render,400)}};
  el.appendChild(s);L.appendChild(el)})
}
function startDatabase(){
 $("tpl").value=mem.tpl;
 $("tpl").oninput=e=>{mem.tpl=e.target.value||DEF;save();render()};
 $("q").oninput=render;
 render();
}
loadDatabase();
</script></body></html>
