<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TPFX Sales Workspace</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3158d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="pwa-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="icon" type="image/jpeg" href="tpfxlogo.jpg">

<style>
:root{
color-scheme:light;
--bg:#f7f9fc;
--card:#fff;
--ink:#192238;
--mut:#758096;
--line:#e8ebf2;
--pri:#1d9bf0;
--new:#8a93a8;
--contacted:#2f7bea;
--warm:#f08a1c;
--hot:#e53935;
--followup:#7c4dff;
--deal:#1f9d55;
--lost:#4a5060;
--social:#1d9bf0;
--social-soft:#e8f5fd;
--shadow:0 1px 3px rgba(15,20,25,.08);
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}

*{
box-sizing:border-box;
margin:0
}

html,body{
height:100%
}

body{
background:var(--bg);
color:var(--ink);
font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;
-webkit-tap-highlight-color:transparent
}

#app{
max-width:900px;
margin:0 auto;
padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))
}

#app.login-screen{
max-width:none;
padding:0
}

body.booting .nav,
body.booting .fab{
display:none
}

.boot-surface{
max-width:900px;
margin:0 auto;
padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))
}

.boot-brand{
display:flex;
align-items:center;
gap:12px;
margin:4px 0 28px
}

.boot-brand img{
width:112px;
height:40px;
object-fit:cover;
border-radius:8px
}

.boot-copy{
display:grid;
gap:7px
}

.boot-copy b{font-size:14px}
.boot-copy span{color:var(--mut);font-size:12px}

.boot-title{
width:min(68%,300px);
height:25px;
margin-bottom:8px
}

.boot-subtitle{
width:min(88%,420px);
height:14px;
margin-bottom:20px
}

.boot-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px
}

.boot-card{
min-height:106px;
padding:16px;
border:1px solid var(--line);
border-radius:18px;
background:var(--card);
box-shadow:var(--shadow)
}

.boot-card.wide{
grid-column:1/-1;
min-height:184px
}

.boot-line{
height:12px;
margin:9px 0;
border-radius:8px
}

.boot-line.short{width:42%}
.boot-line.medium{width:68%}
.boot-line.long{width:90%}

.boot-skeleton{
background:linear-gradient(90deg,#eef1f7 25%,#f7f8fb 38%,#eef1f7 63%);
background-size:400% 100%;
animation:boot-shimmer 1.4s ease infinite
}

@keyframes boot-shimmer{
0%{background-position:100% 0}
100%{background-position:0 0}
}

@media(max-width:620px){
.boot-surface{padding:16px 12px calc(100px + env(safe-area-inset-bottom,0px))}
.boot-brand{margin-bottom:24px}
.boot-brand img{width:76px;height:30px}
.boot-card{min-height:92px;padding:13px}
}

@media(prefers-reduced-motion:reduce){
.boot-skeleton{animation:none}
}

.app-topbar{
position:sticky;
top:0;
z-index:4;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
max-width:900px;
margin:0 auto;
padding:12px 20px;
border-bottom:1px solid rgba(232,235,242,.9);
background:rgba(255,255,255,.96);
backdrop-filter:blur(14px)
}

.app-brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.app-brand-mark{
width:116px;
height:40px;
display:block;
flex:none;
border-radius:8px;
object-fit:cover;
object-position:center;
background:#fff
}

.app-brand-copy b,.app-brand-copy span{
display:block;
white-space:nowrap
}

.app-brand-copy b{
font-size:14px;
line-height:1.2
}

.app-brand-copy span{
margin-top:2px;
color:var(--mut);
font-size:10.5px
}

.app-user{
display:flex;
align-items:center;
gap:9px;
min-width:0;
font-weight:700;
font-size:12px
}

.app-user-name{
max-width:180px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.app-user-avatar{
width:34px;
height:34px;
display:grid;
place-items:center;
flex:none;
border:2px solid #e8edff;
border-radius:50%;
background:#f0f4ff;
color:var(--pri);
font-size:11px;
font-weight:800
}

.app-user-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.app-topbar[hidden]{
display:none
}

.login-shell{
min-height:100vh;
min-height:100dvh;
max-width:460px;
margin:0 auto;
padding:28px 16px;
display:flex;
flex-direction:column;
justify-content:center
}

.login-brand{
width:100%;
height:128px;
display:block;
object-fit:cover;
object-position:center;
background:#fff;
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow)
}

.login-heading{
margin-top:20px
}

.login-heading h1{
font-size:25px
}

.login-card{
margin-top:18px;
padding:18px
}

.login-card input{
min-height:48px
}

h1{
font-size:22px;
font-weight:800;
letter-spacing:-.03em;
line-height:1.2
}

h2{
font-size:15px;
font-weight:800;
margin:20px 0 10px
}

.mut{
color:var(--mut);
font-size:12.5px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:14px;
box-shadow:var(--shadow);
transition:border-color .18s,box-shadow .18s,transform .18s
}

.row{
display:flex;
align-items:center;
gap:10px
}

.sp{
justify-content:space-between
}

button{
font:inherit;
cursor:pointer;
border:0;
color:inherit;
background:none
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
outline:2px solid var(--pri);
outline-offset:2px
}

.btn{
background:var(--pri);
color:#fff;
font-weight:700;
border-radius:999px;
padding:11px 16px;
box-shadow:none
}

.btn.sec{
background:var(--bg);
color:var(--ink);
border:1px solid var(--line)
}

.btn.wa{
background:#1f9d55
}

.btn.big{
width:100%;
padding:15px;
font-size:15px;
border-radius:14px
}

.badge{
display:inline-block;
font-size:11px;
font-weight:800;
color:#fff;
border-radius:99px;
padding:2px 9px
}

.s-new{background:var(--new)}
.s-contacted{background:var(--contacted)}
.s-warm{background:var(--warm)}
.s-hot{background:var(--hot)}
.s-followup{background:var(--followup)}
.s-deal{background:var(--deal)}
.s-lost{background:var(--lost)}

.prog{
height:10px;
border-radius:9px;
background:var(--line);
overflow:hidden;
margin-top:10px
}

.prog i{
display:block;
height:100%;
background:var(--pri);
border-radius:9px;
transition:width .4s
}

.big-n{
font-size:34px;
font-weight:800;
letter-spacing:-.03em;
line-height:1
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
text-align:left;
width:100%;
border:1px solid var(--line);
border-top:3px solid var(--c);
border-radius:18px;
box-shadow:var(--shadow)
}

.stat b{
font-size:24px;
display:block;
font-weight:800
}

.qa{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:4px;
scrollbar-width:none
}

.qa button{
flex:none;
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:9px 13px;
font-weight:600;
white-space:nowrap
}

.lead{
display:block;
width:100%;
text-align:left;
margin-bottom:10px;
border-left:4px solid var(--c)
}

.lead .n{
font-weight:800;
font-size:15px
}

.lead .meta{
display:grid;
grid-template-columns:auto 1fr;
gap:2px 10px;
margin:8px 0;
font-size:12.5px
}

.lead .meta span:nth-child(odd){
color:var(--mut)
}

.note{
font-style:italic;
color:var(--mut);
font-size:12.5px
}

.chips{
display:flex;
gap:6px;
overflow-x:auto;
margin:10px 0;
scrollbar-width:none
}

.chip{
flex:none;
padding:6px 13px;
border-radius:99px;
border:1px solid var(--line);
background:var(--card);
font-weight:600;
font-size:12.5px
}

.chip.on{
background:var(--ink);
color:var(--bg);
border-color:var(--ink)
}

input,select,textarea{
font:inherit;
width:100%;
padding:11px 12px;
border:1px solid var(--line);
border-radius:12px;
background:var(--card);
color:var(--ink)
}

label{
display:block;
font-weight:700;
font-size:12.5px;
margin:12px 0 5px
}

.kan{
display:flex;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:8px;
margin:0 -16px;
padding:0 16px
}

.col{
flex:none;
width:260px;
scroll-snap-align:start;
background:var(--line);
border-radius:16px;
padding:10px
}

.col .lead{
padding:10px
}

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:color-mix(in srgb,var(--card) 96%,transparent);
border-top:1px solid var(--line);
padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
backdrop-filter:blur(16px);
z-index:5
}

.nav div{
max-width:900px;
margin:0 auto;
display:flex;
overflow-x:auto;
scrollbar-width:none
}

.nav div::-webkit-scrollbar{
display:none
}

.nav button{
position:relative;
flex:1 0 62px;
padding:7px 3px;
font-size:10.5px;
font-weight:600;
color:var(--mut);
display:flex;
flex-direction:column;
align-items:center;
gap:3px
}

.nav button svg{
width:21px;
height:21px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

.nav button.on{
color:var(--ink);
font-weight:800
}

.nav button.on svg{
stroke-width:2.2
}

.nav button .nav-badge{
position:absolute;
margin:-2px 0 0 22px;
min-width:17px;
padding:1px 5px;
border-radius:99px;
background:var(--hot);
color:#fff;
font-size:10px;
font-weight:800
}

.fab{
position:fixed;
right:18px;
bottom:calc(78px + env(safe-area-inset-bottom,0px));
width:56px;
height:56px;
border-radius:50%;
background:var(--pri);
color:#fff;
font-size:30px;
box-shadow:0 6px 18px rgba(39,67,214,.4);
z-index:6
}

.ov{
position:fixed;
inset:0;
background:rgba(10,14,30,.5);
z-index:9;
display:flex;
align-items:flex-end;
justify-content:center
}

.sheet{
background:var(--bg);
width:100%;
max-width:720px;
max-height:92vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
animation:up .22s ease
}

@keyframes up{
from{
transform:translateY(40px);
opacity:0
}
}

@media(prefers-reduced-motion:reduce){
.sheet{animation:none}
.prog i{transition:none}
}

.opt{
width:100%;
text-align:left;
padding:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
margin-top:8px;
font-weight:700
}

.bars{
display:flex;
align-items:flex-end;
gap:5px;
height:70px;
margin-top:10px
}

.bars div{
flex:1;
background:var(--pri);
border-radius:5px 5px 0 0;
min-height:3px;
opacity:.85
}

.act{
display:flex;
gap:10px;
padding:11px 0;
border-bottom:1px solid var(--line)
}

.act img{
width:56px;
height:56px;
object-fit:cover;
border-radius:10px
}

.empty{
text-align:center;
padding:28px 10px;
color:var(--mut)
}

.toast{
position:fixed;
left:50%;
bottom:150px;
transform:translateX(-50%);
background:var(--ink);
color:var(--bg);
padding:9px 16px;
border-radius:99px;
font-weight:700;
z-index:20
}

.tl{
border-left:2px solid var(--line);
padding-left:12px;
margin-left:4px
}

.tl p{
margin-bottom:8px;
font-size:12.5px
}

.social-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:0;
padding:14px 16px;
border-bottom:1px solid var(--line)
}

.home-welcome{
position:relative;
overflow:hidden;
min-height:110px;
padding:20px;
border-color:#e6eafa;
background:
radial-gradient(circle at 92% 10%,rgba(49,88,216,.09),transparent 135px),
#fff
}

.home-welcome h1{
max-width:600px;
font-size:25px
}

.home-welcome .mut{
margin-top:7px
}

.home-progress{
padding:18px 20px;
border-color:#e6eafa;
background:linear-gradient(110deg,#fff 0%,#fff 74%,#f5f7ff 100%)
}

.home-progress .big-n{
color:var(--pri)
}

.social-composer textarea{
border-radius:16px;
background:#f7f8fb
}

.social-post{
border-color:transparent;
border-radius:0;
box-shadow:none
}

.social-post:hover{
border-color:transparent;
background:#fbfcff
}

.social-brand{
font-size:25px;
font-weight:800;
letter-spacing:-1.2px;
color:var(--social)
}

.social-subtitle{
color:var(--mut);
font-size:13px
}

.social-wrap{
max-width:600px;
margin:0 auto
}

.social-composer{
display:flex;
gap:12px;
align-items:flex-start
}

.social-feed-title{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:14px 16px;
border-bottom:1px solid var(--line);
font-size:17px;
font-weight:800
}

.feed-refresh{
flex:none;
padding:7px 12px;
border:1px solid var(--line);
border-radius:999px;
color:var(--social);
font-size:12px;
font-weight:700
}

.feed-refresh:disabled{
opacity:.6;
cursor:wait
}

.social-compose-card{
padding:16px;
border:0;
border-bottom:1px solid var(--line);
border-radius:0;
box-shadow:none
}

.social-compose-card:hover{
box-shadow:none
}

.social-composer textarea{
min-height:64px;
resize:vertical;
margin:0
}

.social-actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:10px
}

.social-avatar{
flex:none;
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:50%;
background:linear-gradient(145deg,#3158d8,#8b5cf6);
color:#fff;
font-weight:800;
font-size:14px
}

.photo-avatar{
position:relative;
overflow:hidden
}

.social-avatar.photo-avatar>img{
width:100%;
height:100%;
border-radius:inherit;
object-fit:cover
}

.avatar-photo-fallback{
width:100%;
height:100%;
place-items:center;
border-radius:inherit;
background:linear-gradient(145deg,#3158d8,#8b5cf6);
color:#fff
}

.avatar-photo-fallback:not([hidden]){
display:grid
}

.social-avatar.small{
width:26px;
height:26px;
font-size:10px
}

.social-avatar.profile-avatar{
width:64px;
height:64px;
font-size:20px
}

.role-mark{
display:inline-flex;
vertical-align:middle;
margin-left:5px;
padding:2px 6px;
border-radius:99px;
font-size:10px;
line-height:1.4;
font-weight:800;
background:#eef2ff;
color:#4254a6
}

.role-bm{background:#fff2d6;color:#895b00}
.role-dm{background:#e8e5ff;color:#5544b3}

.feed-image-tools,.feed-post-actions,.feed-comment-form,.profile-photo-card{
display:flex;
align-items:center;
gap:9px
}

.feed-image-tools{margin:10px 0 0 54px}
.feed-image-pick{position:relative;overflow:hidden}
.feed-image-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.feed-image-preview{display:flex;align-items:flex-start;gap:10px;margin:12px 0 0 54px}
.feed-image-preview img{max-width:min(100%,280px);max-height:200px;object-fit:cover;border-radius:12px}
.feed-post-image{display:block;width:calc(100% - 52px);max-height:600px;object-fit:cover;border-radius:16px;margin:0 0 8px 52px;background:#f2f4f7}
.feed-post-image[hidden]{display:none}
.feed-image-unavailable:not([hidden]){margin:0 0 8px 52px;padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--mut);text-align:center}
.feed-post-tools{display:flex;align-items:center;gap:8px}
.feed-post-actions{flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.feed-post-actions .btn{min-height:34px;padding:7px 10px;font-size:12px}
.feed-comments{border-top:1px solid var(--line);margin:10px 0 0 52px;padding-top:10px}
.feed-comment{display:flex;align-items:flex-start;gap:8px;padding:7px 0}
.feed-comment time{display:block;color:var(--mut);font-size:11px}
.feed-comment-form{margin-top:8px}
.feed-comment-form input{flex:1;min-width:0}
.feed-comment-form .btn{flex:none}
.feed-icon-btn{border:0;background:transparent;color:var(--mut);font:inherit;font-size:12px;cursor:pointer}
.profile-photo-card{align-items:center}
.profile-photo-controls{display:grid;gap:6px}
.profile-photo-controls input{max-width:100%}
.chat-bubble-author{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.chat-group-entry{display:flex;align-items:center;gap:6px}
.chat-group-entry>.chat-contact{flex:1;min-width:0}
.chat-group-delete{min-height:32px;padding:6px 9px;color:#b42318}

.social-post{
margin:0;
padding:14px 16px;
border:0;
border-bottom:1px solid var(--line);
border-radius:0;
animation:feed-in .24s ease both
}

@keyframes feed-in{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:translateY(0)}
}

.social-author{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.social-author b{
display:block;
font-size:14px
}

.social-author .mut{
font-size:13px
}

.social-copy{
white-space:pre-wrap;
overflow-wrap:anywhere;
margin:8px 0 10px 52px;
font-size:14.5px;
line-height:1.6
}

.social-post-type{
display:inline-flex;
align-items:center;
gap:5px;
color:var(--social);
font-weight:700;
font-size:11px
}

.feed-post-actions{
justify-content:space-between;
border-top:0;
padding:4px 0 0 48px
}

.feed-post-actions .btn.sec{
min-height:34px;
padding:6px 8px;
border:0;
border-radius:99px;
background:transparent;
color:var(--mut);
box-shadow:none
}

.feed-post-actions .btn.sec:hover{
background:var(--social-soft);
color:var(--social)
}

.feed-comment-error{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:8px 0;
color:#b42318;
font-size:12px
}

.feed-comment-error button{
color:var(--social);
font-weight:700
}

.social-feed-title,.profile h1,h1{
color:var(--ink)
}

.social-compose-card .social-actions .mut{
font-size:12px
}

.social-compose-card .social-actions .btn{
min-width:96px;
padding:9px 18px;
border-radius:99px;
box-shadow:none
}

.social-top .social-brand{
font-size:20px;
letter-spacing:-.5px;
color:var(--ink)
}

.social-top .social-subtitle{
font-size:12px
}

.chat-layout{
display:grid;
grid-template-columns:minmax(230px,.8fr) minmax(0,1.2fr);
gap:14px;
min-height:420px
}

.chat-panel{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden
}

.chat-panel-head{
padding:14px 16px;
border-bottom:1px solid var(--line);
font-weight:800
}

.chat-contact{
position:relative;
width:100%;
display:flex;
align-items:center;

let S,
tab='feed',

q='',

TEAM_LEADS=[],

TEAM_LEADS_ERROR='',
per='hari',
USER='',
FEED=[],
FEED_LOCAL_ECHOES=[],
FEED_TEXT='',
FEED_COMMENT_DRAFTS={},
FEED_COMMENT_LOADING={},
FEED_COMMENT_SUBMITTING={},
FEED_LOADING=false,
FEED_RECENT_LOADING=false,
FEED_POSTING=false,
FEED_IMAGE='',
PROFILE_PHOTO='',
PROFILE_PHOTO_DRAFT='',
CHAT_CONTACTS=[],
CHAT_MESSAGES=[],
CHAT_LOCAL_ECHOES=[],
CHAT_GROUPS=[],
CHAT_GLOBAL=null,
CHAT_ACTIVE=null,
CHAT_TIMER=null,
CHAT_SYNC_TIMER=null,
CHAT_HISTORY_LOADING=false,
CHAT_SYNC_LOADING=false,
CHAT_HISTORY_REQUEST=0,
CHAT_SYNC_CURSOR=0,
CHAT_OLDEST_ROW=0,
CHAT_HAS_MORE=false,
CHAT_SYNC_ERROR_AT=0,
CHAT_SENDING=false,

LOGIN_PENDING=false;

function seed(){
return{
name:'Sales',
target:10,
leads:[],
acts:[]
}
}

S=seed();

let TOK='',
t,
ROLE='';

try{
TOK=
localStorage.getItem('swt')||
'';

// ============================================================
// API URL BARU
// ============================================================

const API=
'https://script.google.com/macros/s/AKfycbwCiMQjyvd_GHqc-TOzofoDEcpOj_-_uxs2ciX4wZG7VuG3hoZlInRuyO3cmPxSWS6F/exec';


// ============================================================
// RPC
// ============================================================

const rpc=async(fn,...a)=>{

if(
API.indexOf('PASTE')==0
){
throw new Error(
'API URL belum diisi di index.html'
);
}

let r,
j,
txt='';

try{

r=await fetch(
API,
{
method:'POST',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:JSON.stringify({
fn,
args:a
}),

cache:'no-store'
}
);

txt=await r.text();

try{

j=JSON.parse(txt);

}catch(e){

throw new Error(
'Server tidak mengirim JSON valid ('+
r.status+
'). Silakan coba lagi.'
);

}

}catch(e){

throw e;

}

if(
!j ||
typeof j!='object'
){

throw new Error(
'Server mengirim respons yang tidak valid untuk "'+
fn+
'".'
);

}

if(j.error){

throw new Error(
j.error
);

}

if(
!Object.prototype.hasOwnProperty.call(j,'result') ||
typeof j.result=='undefined'
){

throw new Error(
'Apps Script tidak mengembalikan hasil untuk "'+
fn+
'". Pastikan endpoint terdaftar di api_(), mengembalikan nilai, lalu deploy versi terbaru.'
);

}

return j.result;

};


// ============================================================
// SAVE
// ============================================================

const save=()=>{

if(!TOK)return;

clearTimeout(t);

t=setTimeout(

()=>{

rpc(
'saveState',
TOK,
JSON.stringify(S)
)

.then(

r=>{

if(
r &&
r.err==='AUTH'
){

logout();

}else if(
r &&
r.err
){

toast(
'Gagal sinkron: '+
r.err
);

}

}

)

.catch(

()=>{

toast(
'Gagal sinkron. Data lokal tetap tersimpan.'
);

}

)

},

800

);

};


// ============================================================
// BOOT / AUTO LOGIN
// ============================================================

async function boot(){

if(!TOK){

return loginView();

}

try{

const r=
await rpc(
'loadState',
TOK
);

if(!r || typeof r!='object'){

throw new Error(
'Endpoint loadState mengembalikan respons kosong. Periksa fungsi loadState di Apps Script dan deploy ulang.'
);

}


if(
r &&
r.err==='AUTH'
){

TOK='';

try{

localStorage.removeItem(
'swt'
);
localStorage.removeItem(
'swt_user'
);

}catch(e){}

return loginView(
'Sesi telah berakhir. Silakan login kembali.'
);

}


if(
r &&
r.err
){

throw new Error(
r.err
);

}


if(
!r.user ||
!r.name ||
!r.role ||
!Object.prototype.hasOwnProperty.call(r,'state') ||
(
r.state &&
(
!Array.isArray(r.state.leads) ||
!Array.isArray(r.state.acts)
)
)
){

throw new Error(
'Format respons loadState tidak lengkap. Periksa endpoint loadState di Apps Script dan deploy ulang.'
);

}

S=
r.state &&
Array.isArray(r.state.leads) &&
Array.isArray(r.state.acts)
?r.state
:seed();

if(Number.isFinite(Number(r.target))&&Number(r.target)>=1){
S.target=Math.floor(Number(r.target));
}

USER=
r.user||
'';

S.name=
r.name ||
S.name ||
'Sales';


ROLE=
r.role ||
'BDO';
PROFILE_PHOTO=String(r.photoUrl||'');

renderAppHeader();


try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
r.user||''
);

}catch(e){}


document
.querySelector('.nav')
.style.display='';


$('#fab').style.display=
(
ROLE=='DM' ||
ROLE=='BM'
)
?'none'
:'';


const manager=ROLE=='DM'||ROLE=='BM';
if(manager)TEAM=[];
render();
$('#app').setAttribute('aria-busy','false');
document.body.classList.remove('booting');

if(manager){
const bootToken=TOK;
loadTeam().then(()=>{
if(TOK==bootToken)render();
});
}

pollChatNotifications();

if(tab=='feed'){
loadSocialFeed();
}


}catch(e){

const msg=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);


// Jangan menghapus token.
// Error JSON/network tidak membuat user
// harus login ulang.

sessionError(
msg
);

}

}

// ============================================================
// DO LOGIN
// ============================================================

async function doLogin(){

if(LOGIN_PENDING)return;

const u=
$('#lu').value.trim();

const p=
$('#lp').value;


if(
!u ||
!p
){

$('#le').textContent=
'Isi username dan password';

return;

}

LOGIN_PENDING=true;
const button=$('#app .login-card .btn');
if(button){
button.disabled=true;
button.textContent='Memproses...';
}

try{

const r=
await rpc(
'login',
u,
p
);


if(r.err){

$('#le').textContent=
'Username atau password salah';

return;

}


TOK=
r.token;


try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
u
);

}catch(e){}


await boot();


}catch(e){

$('#le').textContent=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);

}finally{

LOGIN_PENDING=false;
const currentButton=$('#app .login-card .btn');
if(currentButton){
currentButton.disabled=false;
currentButton.textContent='Masuk';
}

}

}

document.createElement(

const wa=p=>{

p=
String(p)
.replace(/\D/g,'');

if(
p[0]=='0'
){

p=
'62'+
p.slice(1);

}

return'https://wa.me/'+p;

};

S.leads.find(
x=>x.id==id
);

'wa',

l.id,
true
);

);

function addAct(
type,
text,
leadId,
silent,
extra={}
){

S.acts.unshift({

id:Date.now(),

type,

text,

leadId,

ts:Date.now(),

...extra

});

save();

if(!silent){

render();

}

}


const todayActs=()=>
S.acts.filter(
a=>
new Date(a.ts)
.toISOString()
.slice(0,10)==iso(0)
||
new Date(a.ts)
.toDateString() ==
new Date()
.toDateString()
);


const dueFU=()=>
S.leads.filter(
l=>

function mergeFeedRows(rows){

const previousById=new Map(FEED.map(item=>[String(item.id),item]));
const serverRows=rows.filter(item=>
!String(item.id||'').startsWith('local-post-')
).map(item=>{
const previous=previousById.get(String(item.id));
return previous&&previous.commentsOpen
?Object.assign({},item,{
commentsOpen:true,
comments:Array.isArray(previous.comments)?previous.comments:[],
commentsLoading:Boolean(previous.commentsLoading),
commentsError:String(previous.commentsError||'')
})
:item;
});
const keep=[];
const now=Date.now();

FEED_LOCAL_ECHOES.forEach(local=>{
if(local.pending){
keep.push(local);
serverRows.push(local);
return;
}

const match=serverRows.findIndex(item=>
item.kind=='post' &&
String(item.username||'').toLowerCase()==String(local.username||'').toLowerCase() &&
String(item.text||'')==local.text &&
String(item.imageUrl||'')==String(local.imageUrl||'') &&
(Number(item.ts)||0)>=local.ts-5000 &&
(Number(item.ts)||0)<=local.ts+120000
);

if(match>=0){
return;
}

if(local.pending||now-local.ts<120000){
keep.push(local);
serverRows.push(local);
}
});

FEED_LOCAL_ECHOES=keep;
return serverRows.sort((a,b)=>
Number(Boolean(b.pinned))-Number(Boolean(a.pinned))||
(Number(b.ts)||0)-(Number(a.ts)||0)
);

}

function prepareFeedImage(input){
const file=input.files&&input.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){toast('Pilih file gambar.');input.value='';return;}
if(file.size>8*1024*1024){toast('Ukuran foto maksimal 8 MB.');input.value='';return;}
const reader=new FileReader();
reader.onerror=()=>toast('Foto gagal dibaca.');
reader.onload=()=>{
const image=new Image();
image.onerror=()=>toast('Format foto tidak dapat dibuka.');
image.onload=()=>{
const scale=Math.min(1,1200/image.width,1200/image.height);
const canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.width*scale));
canvas.height=Math.max(1,Math.round(image.height*scale));
const context=canvas.getContext('2d');
if(!context){toast('Browser tidak dapat memproses foto.');return;}
context.drawImage(image,0,0,canvas.width,canvas.height);
FEED_IMAGE=canvas.toDataURL('image/jpeg',.78);
render();
};
image.src=String(reader.result||'');
};
reader.readAsDataURL(file);
}

]);

for(const r of results){

throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat daftar chat');
}
if(!Array.isArray(r.rows))throw new Error('Endpoint chat harus mengembalikan rows berupa array.');
}

CHAT_CONTACTS=contacts.rows;
CHAT_GROUPS=groups.rows;
initializeChatSeen(CHAT_CONTACTS,CHAT_GROUPS);
updateChatUnreadIndicators();

if(CHAT_ACTIVE){
const collection=CHAT_ACTIVE.type=='group'?CHAT_GROUPS:CHAT_ACTIVE.type=='personal'?CHAT_CONTACTS:[CHAT_GLOBAL].filter(Boolean);
if(!collection.some(x=>String(CHAT_ACTIVE.type=='personal'?x.username:x.id)==CHAT_ACTIVE.id)){
CHAT_ACTIVE=null;
CHAT_MESSAGES=[];
}
}

updateChatUnreadIndicators();

}catch(e){

}

function chatSeenKey(){
return 'tpfx-chat-seen-'+String(USER||'').toLowerCase();
}


function chatNotifiedKey(){
return 'tpfx-chat-notified-'+String(USER||'').toLowerCase();
}


function readChatSeen(){
try{
const value=JSON.parse(localStorage.getItem(chatSeenKey())||'{}');
return value&&typeof value=='object'?value:{};
}catch(e){
return {};
}
}


function readChatNotified(){
try{
const value=JSON.parse(localStorage.getItem(chatNotifiedKey())||'{}');
return value&&typeof value=='object'?value:{};
}catch(e){
return {};
}
}


function writeChatSeen(seen){
try{
localStorage.setItem(chatSeenKey(),JSON.stringify(seen));
}catch(e){
console.error('Status baca chat tidak dapat disimpan:',e);
}
}


function writeChatNotified(notified){
try{
localStorage.setItem(chatNotifiedKey(),JSON.stringify(notified));
}catch(e){
console.error('Status notifikasi chat tidak dapat disimpan:',e);
}
}


function chatThreadKey(type,id){
return type+':'+String(id);
}


function initializeChatSeen(contacts,groups){
let storedSeen=null,storedNotified=null;
try{
storedSeen=localStorage.getItem(chatSeenKey());
storedNotified=localStorage.getItem(chatNotifiedKey());
}catch(e){
console.error('Status chat tidak dapat dimuat:',e);
}
const baseline={};
contacts.forEach(contact=>{
baseline[chatThreadKey('personal',contact.username)]=Number(contact.lastTs)||0;
});
groups.forEach(group=>{
baseline[chatThreadKey('group',group.id)]=Number(group.lastTs)||0;
});
baseline[chatThreadKey('global','global')]=0;
if(storedSeen===null)writeChatSeen(baseline);
if(storedNotified===null){
writeChatNotified(storedSeen===null?baseline:readChatSeen());
}
}


function markChatSeen(type,id,ts){
const seen=readChatSeen();
const key=chatThreadKey(type,id);
seen[key]=Math.max(Number(seen[key])||0,Number(ts)||0);
writeChatSeen(seen);
updateChatUnreadIndicators();
}


function chatUnread(type,item){
const id=type=='personal'?item.username:(item.id||'global');
return Number(item.lastTs)>0&&
String(item.lastFrom||'').toLowerCase()!=String(USER).toLowerCase()&&
Number(item.lastTs)>(Number(readChatSeen()[chatThreadKey(type,id)])||0);
}


function unreadChatCount(){
return CHAT_CONTACTS.filter(item=>chatUnread('personal',item)).length+
CHAT_GROUPS.filter(item=>chatUnread('group',item)).length+

async function pollChatNotifications(){
if(!TOK||CHAT_NOTIFICATIONS_LOADING)return;
CHAT_NOTIFICATIONS_LOADING=true;
try{
const result=await rpc('chatNotificationSummary',TOK);
if(!result||typeof result!='object')throw new Error('Respons ringkasan notifikasi chat tidak valid.');
if(result.err){
if(result.err=='AUTH'){logout();return;}
throw new Error(typeof result.err=='string'?result.err:'Ringkasan chat tidak dapat dimuat');
}
if(!Array.isArray(result.contacts)||!Array.isArray(result.groups))throw new Error('Ringkasan chat harus mengembalikan contacts dan groups berupa array.');
const contacts=result.contacts,groups=result.groups,global=result.global||{id:'global',lastTs:0,lastFrom:'',lastText:''};
initializeChatSeen(contacts,groups);
CHAT_CONTACTS=contacts;
CHAT_GROUPS=groups;
CHAT_GLOBAL=global;
const seen=readChatSeen(),notified=readChatNotified();
const currentChatIsOpen=(type,id)=>
(document.visibilityState!='hidden'&&(tab=='chat'||dmTab=='chat'))&&CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&String(CHAT_ACTIVE.id)==String(id);
const incoming=[];
[['personal',contacts],['group',groups],['global',[global]]].forEach(([type,items])=>{
items.forEach(item=>{
const id=type=='personal'?item.username:(item.id||'global');
const key=chatThreadKey(type,id);
const lastTs=Number(item.lastTs)||0;
if(currentChatIsOpen(type,id)){
seen[key]=Math.max(Number(seen[key])||0,lastTs);
return;
}
if(lastTs>Math.max(Number(seen[key])||0,Number(notified[key])||0)&&String(item.lastFrom||'').toLowerCase()!=String(USER).toLowerCase()){
incoming.push({type,item,id,key,lastTs});
}
});
});
writeChatSeen(seen);
if('Notification' in window&&Notification.permission=='granted'){
incoming.forEach(message=>{
const title=message.type=='group'?message.item.name:message.item.nama;
const notification=new Notification(title||'Pesan baru', {
body:String(message.item.lastText||'Anda menerima pesan baru'),
icon:'./pwa-icon-192.png',
tag:'tpfx-chat-'+message.key,
renotify:false
});
notification.onclick=()=>{
window.focus();
if(message.type=='group')openGroupChat(message.id);
else if(message.type=='global')openGlobalChat();
else openTeamChat(message.id);
notification.close();
};
notified[message.key]=Math.max(Number(notified[message.key])||0,message.lastTs);
});
writeChatNotified(notified);
}
updateChatUnreadIndicators();
}catch(e){
const now=Date.now();
if(now-CHAT_NOTIFICATION_ERROR_AT>60000){
console.error('Notifikasi chat gagal diperbarui:',e);
CHAT_NOTIFICATION_ERROR_AT=now;
}
}finally{
CHAT_NOTIFICATIONS_LOADING=false;
}
}

if(ROLE=='DM'||ROLE=='BM')dmTab='chat';else tab='chat';

const requestId=++CHAT_HISTORY_REQUEST;
CHAT_HISTORY_LOADING=true;

try{
const type=CHAT_ACTIVE.type;
const target=CHAT_ACTIVE.id;
const r=await rpc(
type=='group'?'groupHistory':type=='global'?'globalChatHistory':'chatHistory',

target,
0
);

if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat pesan');
}
if(!Array.isArray(r.rows))throw new Error('Endpoint riwayat chat harus mengembalikan rows berupa array.');

if(requestId!=CHAT_HISTORY_REQUEST||!CHAT_ACTIVE||CHAT_ACTIVE.type!=type||CHAT_ACTIVE.id!=target)return;

function mergeChatRows(rows,type,target){

const serverRows=rows.filter(item=>
!String(item.id||'').startsWith('local-message-')
);
const keep=[];
const now=Date.now();

CHAT_LOCAL_ECHOES=CHAT_LOCAL_ECHOES.filter(local=>
local.type!=type||local.target!=target||now-local.ts<120000
);

CHAT_LOCAL_ECHOES.forEach(local=>{
if(local.type!=type||local.target!=target)return;

if(local.pending){
serverRows.push(local);
return;
}

const match=serverRows.findIndex(item=>
String(item.from||'').toLowerCase()==String(local.from||'').toLowerCase() &&
String(item.text||'')==local.text &&
(Number(item.ts)||0)>=local.ts-5000 &&
(Number(item.ts)||0)<=local.ts+120000
);

if(match>=0){
return;
}

serverRows.push(local);
});

return serverRows.sort((a,b)=>
(Number(a.ts)||0)-(Number(b.ts)||0) ||
(Number(a.row)||0)-(Number(b.row)||0)
);

}

async function refreshChatHistory(){

if(!(tab=='chat'||dmTab=='chat')||!CHAT_ACTIVE||CHAT_HISTORY_LOADING||CHAT_SYNC_LOADING)return;
if(document.visibilityState=='hidden')return;

CHAT_SYNC_LOADING=true;
const type=CHAT_ACTIVE.type;
const target=CHAT_ACTIVE.id;
const cursor=CHAT_SYNC_CURSOR;

try{
const r=await rpc('chatSync',TOK,type,target,cursor);

if(!r||typeof r!='object')throw new Error('Format respons riwayat chat tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat pesan');
}
if(!Array.isArray(r.rows))throw new Error('Endpoint riwayat chat harus mengembalikan rows berupa array.');
if(!Number.isFinite(Number(r.cursor))||Number(r.cursor)<cursor)throw new Error('Cursor sinkronisasi chat tidak valid.');
if(!CHAT_ACTIVE||CHAT_ACTIVE.type!=type||CHAT_ACTIVE.id!=target||CHAT_SYNC_CURSOR!=cursor)return;

const box=$('#chatPreview');
const shouldScroll=!box||box.scrollHeight-box.scrollTop-box.clientHeight<60;
CHAT_SYNC_CURSOR=Number(r.cursor);
if(r.rows.length)CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES.concat(r.rows),type,target);
if((tab=='chat'||dmTab=='chat')&&document.visibilityState!='hidden'){
markChatSeen(type,target,CHAT_MESSAGES.reduce((latest,message)=>Math.max(latest,Number(message.ts)||0),0));
updateChatNavBadge();
}
if(box&&r.rows.length){
renderChatMessages();
if(shouldScroll)scrollChatToBottom();
}
}catch(e){
if(Date.now()-CHAT_SYNC_ERROR_AT>30000){
CHAT_SYNC_ERROR_AT=Date.now();
toast('Chat gagal diperbarui: '+String((e&&e.message)||e));
}
}finally{
CHAT_SYNC_LOADING=false;
}

}


async function sendTeamMessage(event){

event.preventDefault();
if(CHAT_SENDING)return;
const input=$('#chatText');
const text=input.value.trim();
if(!CHAT_ACTIVE||!text)return;

const target=CHAT_ACTIVE.id;
const type=CHAT_ACTIVE.type;
const local={
id:'local-message-'+Date.now()+'-'+Math.random().toString(36).slice(2),
from:USER,
nama:S.name,
text:text,
ts:Date.now(),
pending:true,
type:type,
target:target
};

CHAT_LOCAL_ECHOES.push(local);
CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES,type,target);
input.value='';
CHAT_SENDING=true;
const submit=input.form&&input.form.querySelector('[type="submit"]');
if(submit)submit.disabled=true;
renderChatMessages();
scrollChatToBottom();

try{
const r=await rpc(
type=='group'?'sendGroupChat':type=='global'?'sendGlobalChat':'sendChat',
TOK,
target,
text
);
if(!r||typeof r!='object')throw new Error('Format respons pengiriman pesan tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Pesan gagal dikirim');
}
if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi pengiriman pesan.');

local.pending=false;
if(type=='group'){
const group=CHAT_GROUPS.find(item=>String(item.id)==target);
if(group){group.lastText=text;group.lastTs=local.ts;group.lastFrom=USER;}
}else if(type=='personal'){
const contact=CHAT_CONTACTS.find(item=>String(item.username)==target);
if(contact){contact.lastText=text;contact.lastTs=local.ts;contact.lastFrom=USER;}
}else if(CHAT_GLOBAL){
CHAT_GLOBAL.lastText=text;CHAT_GLOBAL.lastTs=local.ts;CHAT_GLOBAL.lastFrom=USER;
}
markChatSeen(type,target,local.ts);

const listSelector=type=='group'?'[data-group]':type=='global'?'[data-global]':'[data-username]';
Array.from(document.querySelectorAll(listSelector)).forEach(button=>{
const key=type=='group'?button.dataset.group:type=='global'?'global':button.dataset.username;
if(String(key)!=target)return;
const preview=button.querySelector('.chat-contact-copy span');
if(preview)preview.textContent=text;
});

if(CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&CHAT_ACTIVE.id==target){
CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES,type,target);
renderChatMessages();
}

toast('Pesan terkirim');
}catch(e){
CHAT_LOCAL_ECHOES=CHAT_LOCAL_ECHOES.filter(item=>item.id!=local.id);
if(CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&CHAT_ACTIVE.id==target){
CHAT_MESSAGES=CHAT_MESSAGES.filter(item=>item.id!=local.id);
renderChatMessages();
if(input&& !input.value)input.value=text;
}
toast('Pesan gagal dikirim: '+String((e&&e.message)||e));
}finally{
CHAT_SENDING=false;
if(submit&&submit.isConnected)submit.disabled=false;
}

}

async function loadTeamLeads(){

TEAM_LEADS_LOADING=true;
TEAM_LEADS_ERROR='';
render();

try{

const r=await rpc(
'teamLeads',
TOK
);

if(r&&r.err=='AUTH'){
logout();
return;
}

if(r&&r.err)throw new Error(typeof r.err=='string'?r.err:'Gagal memuat lead tim');
if(!r||!Array.isArray(r.rows))throw new Error('Data lead tim dari server tidak valid');

TEAM_LEADS=r.rows;

}catch(e){

TEAM_LEADS_ERROR=String((e&&e.message)||e);

}finally{

TEAM_LEADS_LOADING=false;
if(TOK)render();

}

}

const f=
el.files[0];

if(!f)return;


const r=
new FileReader();


r.onload=()=>{

const i=
new Image();


i.onload=()=>{

const c=
document.createElement(
'canvas'
);

const s=
Math.min(
1,
700/i.width
);

c.width=
i.width*s;

c.height=
i.height*s;


c.getContext(
'2d'
).drawImage(
i,
0,
0,
c.width,
c.height
);


img=
c.toDataURL(
'image/jpeg',
.6
);


$('#pv').src=
img;

$('#pv')
.style.display=
'block';

};


i.src=
r.result;

};


r.readAsDataURL(f);

}

function prepareProfilePhoto(input){
const file=input.files&&input.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){toast('Pilih file gambar.');input.value='';return;}
if(file.size>8*1024*1024){toast('Ukuran foto maksimal 8 MB.');input.value='';return;}
const reader=new FileReader();
reader.onerror=()=>toast('Foto profil gagal dibaca.');
reader.onload=()=>{
const image=new Image();
image.onerror=()=>toast('Format foto profil tidak dapat dibuka.');
image.onload=()=>{
const side=512,scale=Math.min(1,side/image.width,side/image.height);
const canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.width*scale));
canvas.height=Math.max(1,Math.round(image.height*scale));
const context=canvas.getContext('2d');
if(!context){toast('Browser tidak dapat memproses foto profil.');return;}
context.drawImage(image,0,0,canvas.width,canvas.height);
PROFILE_PHOTO_DRAFT=canvas.toDataURL('image/jpeg',.8);
render();
};
image.src=String(reader.result||'');
};
reader.readAsDataURL(file);
}

async function saveProfilePhoto(){
if(!PROFILE_PHOTO_DRAFT)return;
try{
toast('Mengunggah foto profil...');
const url=await rpc('uploadImg',TOK,PROFILE_PHOTO_DRAFT);
if(typeof url!='string'||!/^https?:\/\//i.test(url))throw new Error('Server tidak mengembalikan tautan foto yang valid.');
const result=await rpc('updateProfilePhoto',TOK,url);
if(!result||result.ok!==1)throw new Error(result&&result.err||'Foto profil gagal disimpan.');
PROFILE_PHOTO=url;
PROFILE_PHOTO_DRAFT='';
renderAppHeader();
render();
toast('Foto profil diperbarui.');
}catch(e){toast('Foto profil gagal disimpan: '+String((e&&e.message)||e));}
}

async function saveBDOTarget(username){

const input=$('#bdoTarget');
const target=Number(input.value);

if(!Number.isInteger(target)||target<1||target>1000){
toast('Target harus berupa bilangan bulat antara 1 sampai 1000');
return;
}

try{
const r=await rpc('updateBDOTarget',TOK,username,target);
if(!r||typeof r!='object')throw new Error('Format respons updateBDOTarget tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Target gagal disimpan');
}
if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi perubahan target.');

const member=TEAM.find(item=>String(item.m.user).toLowerCase()==String(username).toLowerCase());
if(member)member.m.state.target=target;
render();
toast('Target aktivitas BDO diperbarui');
}catch(e){
toast('Target gagal disimpan: '+String((e&&e.message)||e));
}

}

async function resetBDOPassword(username){

const password=$('#resetBDOPassword').value;
if(password.length<6||password.length>128){
toast('Password harus terdiri dari 6 sampai 128 karakter');
return;
}

try{
const r=await rpc('resetBDOPassword',TOK,username,password);
if(!r||typeof r!='object')throw new Error('Format respons resetBDOPassword tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Password gagal direset');
}
if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi reset password.');

closeS();
toast('Password direset. Sampaikan password baru secara pribadi kepada BDO.');
}catch(e){
toast('Password gagal direset: '+String((e&&e.message)||e));
}

}

String(USER).toLowerCase()

);

}

!confirm(
'Hapus akun @'+username+' beserta seluruh data akun tersebut?'
)
){

}


try{

const r=
await rpc(
'deleteUser',
TOK,
username
);

if(r.err){

toast(
typeof r.err=='string'
?r.err
:'Gagal menghapus akun'
);

toast(

}catch(e){
