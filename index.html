<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TPFX Sales Workspace</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="tpfxlogo.jpg">

<style>
:root{
color-scheme:light;
--bg:#fff;
--card:#fff;
--ink:#192238;
--mut:#758096;
--line:#e8ebf2;
--pri:#3158d8;
--new:#8a93a8;
--contacted:#2f7bea;
--warm:#f08a1c;
--hot:#e53935;
--followup:#7c4dff;
--deal:#1f9d55;
--lost:#4a5060;
--social:#3158d8;
--social-soft:#f0f4ff;
--shadow:0 8px 26px rgba(30,45,80,.055);
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}

*{
box-sizing:border-box;
margin:0
}

html,body{
height:100%
}

body{
background:var(--bg);
color:var(--ink);
font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;
-webkit-tap-highlight-color:transparent
}

#app{
max-width:900px;
margin:0 auto;
padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))
}

#app.login-screen{
max-width:none;
padding:0
}

.app-topbar{
position:sticky;
top:0;
z-index:4;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
max-width:900px;
margin:0 auto;
padding:12px 20px;
border-bottom:1px solid rgba(232,235,242,.9);
background:rgba(255,255,255,.94);
backdrop-filter:blur(14px)
}

.app-brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.app-brand-mark{
width:116px;
height:40px;
display:block;
flex:none;
border-radius:8px;
object-fit:cover;
object-position:center;
background:#fff
}

.app-brand-copy b,.app-brand-copy span{
display:block;
white-space:nowrap
}

.app-brand-copy b{
font-size:14px;
line-height:1.2
}

.app-brand-copy span{
margin-top:2px;
color:var(--mut);
font-size:10.5px
}

.app-user{
display:flex;
align-items:center;
gap:9px;
min-width:0;
font-weight:700;
font-size:12px
}

.app-user-name{
max-width:180px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.app-user-avatar{
width:34px;
height:34px;
display:grid;
place-items:center;
flex:none;
border:2px solid #e8edff;
border-radius:50%;
background:#f0f4ff;
color:var(--pri);
font-size:11px;
font-weight:800
}

.app-topbar[hidden]{
display:none
}

.login-shell{
min-height:100vh;
min-height:100dvh;
max-width:460px;
margin:0 auto;
padding:28px 16px;
display:flex;
flex-direction:column;
justify-content:center
}

.login-brand{
width:100%;
height:128px;
display:block;
object-fit:cover;
object-position:center;
background:#fff;
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow)
}

.login-heading{
margin-top:20px
}

.login-heading h1{
font-size:25px
}

.login-card{
margin-top:18px;
padding:18px
}

.login-card input{
min-height:48px
}

h1{
font-size:22px;
font-weight:800;
letter-spacing:-.03em;
line-height:1.2
}

h2{
font-size:15px;
font-weight:800;
margin:20px 0 10px
}

.mut{
color:var(--mut);
font-size:12.5px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:14px;
box-shadow:var(--shadow);
transition:border-color .18s,box-shadow .18s,transform .18s
}

.row{
display:flex;
align-items:center;
gap:10px
}

.sp{
justify-content:space-between
}

button{
font:inherit;
cursor:pointer;
border:0;
color:inherit;
background:none
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
outline:2px solid var(--pri);
outline-offset:2px
}

.btn{
background:var(--pri);
color:#fff;
font-weight:700;
border-radius:14px;
padding:11px 16px;
box-shadow:0 5px 14px rgba(39,67,214,.16)
}

.btn.sec{
background:var(--bg);
color:var(--ink);
border:1px solid var(--line)
}

.btn.wa{
background:#1f9d55
}

.btn.big{
width:100%;
padding:15px;
font-size:15px;
border-radius:14px
}

.badge{
display:inline-block;
font-size:11px;
font-weight:800;
color:#fff;
border-radius:99px;
padding:2px 9px
}

.s-new{background:var(--new)}
.s-contacted{background:var(--contacted)}
.s-warm{background:var(--warm)}
.s-hot{background:var(--hot)}
.s-followup{background:var(--followup)}
.s-deal{background:var(--deal)}
.s-lost{background:var(--lost)}

.prog{
height:10px;
border-radius:9px;
background:var(--line);
overflow:hidden;
margin-top:10px
}

.prog i{
display:block;
height:100%;
background:var(--pri);
border-radius:9px;
transition:width .4s
}

.big-n{
font-size:34px;
font-weight:800;
letter-spacing:-.03em;
line-height:1
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
text-align:left;
width:100%;
border:1px solid var(--line);
border-top:3px solid var(--c);
border-radius:18px;
box-shadow:var(--shadow)
}

.stat b{
font-size:24px;
display:block;
font-weight:800
}

.qa{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:4px;
scrollbar-width:none
}

.qa button{
flex:none;
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:9px 13px;
font-weight:600;
white-space:nowrap
}

.lead{
display:block;
width:100%;
text-align:left;
margin-bottom:10px;
border-left:4px solid var(--c)
}

.lead .n{
font-weight:800;
font-size:15px
}

.lead .meta{
display:grid;
grid-template-columns:auto 1fr;
gap:2px 10px;
margin:8px 0;
font-size:12.5px
}

.lead .meta span:nth-child(odd){
color:var(--mut)
}

.note{
font-style:italic;
color:var(--mut);
font-size:12.5px
}

.chips{
display:flex;
gap:6px;
overflow-x:auto;
margin:10px 0;
scrollbar-width:none
}

.chip{
flex:none;
padding:6px 13px;
border-radius:99px;
border:1px solid var(--line);
background:var(--card);
font-weight:600;
font-size:12.5px
}

.chip.on{
background:var(--ink);
color:var(--bg);
border-color:var(--ink)
}

input,select,textarea{
font:inherit;
width:100%;
padding:11px 12px;
border:1px solid var(--line);
border-radius:12px;
background:var(--card);
color:var(--ink)
}

label{
display:block;
font-weight:700;
font-size:12.5px;
margin:12px 0 5px
}

.kan{
display:flex;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:8px;
margin:0 -16px;
padding:0 16px
}

.col{
flex:none;
width:260px;
scroll-snap-align:start;
background:var(--line);
border-radius:16px;
padding:10px
}

.col .lead{
padding:10px
}

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:color-mix(in srgb,var(--card) 94%,transparent);
border-top:1px solid var(--line);
padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
backdrop-filter:blur(16px);
z-index:5
}

.nav div{
max-width:900px;
margin:0 auto;
display:flex;
overflow-x:auto;
scrollbar-width:none
}

.nav div::-webkit-scrollbar{
display:none
}

.nav button{
flex:1 0 62px;
padding:7px 3px;
font-size:10.5px;
font-weight:600;
color:var(--mut);
display:flex;
flex-direction:column;
align-items:center;
gap:1px
}

.nav button span{
font-size:20px
}

.nav button.on{
color:var(--pri)
}

.nav button.on span{
transform:translateY(-1px)
}

.nav button .nav-badge{
position:absolute;
margin:-2px 0 0 22px;
min-width:17px;
padding:1px 5px;
border-radius:99px;
background:var(--hot);
color:#fff;
font-size:10px;
font-weight:800
}

.fab{
position:fixed;
right:18px;
bottom:calc(78px + env(safe-area-inset-bottom,0px));
width:56px;
height:56px;
border-radius:50%;
background:var(--pri);
color:#fff;
font-size:30px;
box-shadow:0 6px 18px rgba(39,67,214,.4);
z-index:6
}

.ov{
position:fixed;
inset:0;
background:rgba(10,14,30,.5);
z-index:9;
display:flex;
align-items:flex-end;
justify-content:center
}

.sheet{
background:var(--bg);
width:100%;
max-width:720px;
max-height:92vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
animation:up .22s ease
}

@keyframes up{
from{
transform:translateY(40px);
opacity:0
}
}

@media(prefers-reduced-motion:reduce){
.sheet{animation:none}
.prog i{transition:none}
}

.opt{
width:100%;
text-align:left;
padding:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
margin-top:8px;
font-weight:700
}

.bars{
display:flex;
align-items:flex-end;
gap:5px;
height:70px;
margin-top:10px
}

.bars div{
flex:1;
background:var(--pri);
border-radius:5px 5px 0 0;
min-height:3px;
opacity:.85
}

.act{
display:flex;
gap:10px;
padding:11px 0;
border-bottom:1px solid var(--line)
}

.act img{
width:56px;
height:56px;
object-fit:cover;
border-radius:10px
}

.empty{
text-align:center;
padding:28px 10px;
color:var(--mut)
}

.toast{
position:fixed;
left:50%;
bottom:150px;
transform:translateX(-50%);
background:var(--ink);
color:var(--bg);
padding:9px 16px;
border-radius:99px;
font-weight:700;
z-index:20
}

.tl{
border-left:2px solid var(--line);
padding-left:12px;
margin-left:4px
}

.tl p{
margin-bottom:8px;
font-size:12.5px
}

.social-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:0 0 16px
}

.home-welcome{
position:relative;
overflow:hidden;
min-height:110px;
padding:20px;
border-color:#e6eafa;
background:
radial-gradient(circle at 92% 10%,rgba(49,88,216,.09),transparent 135px),
#fff
}

.home-welcome h1{
max-width:600px;
font-size:25px
}

.home-welcome .mut{
margin-top:7px
}

.home-progress{
padding:18px 20px;
border-color:#e6eafa;
background:linear-gradient(110deg,#fff 0%,#fff 74%,#f5f7ff 100%)
}

.home-progress .big-n{
color:var(--pri)
}

.social-composer textarea{
border-radius:16px;
background:#f7f8fb
}

.social-post{
border-color:#e9ecf2;
box-shadow:0 5px 18px rgba(30,45,80,.035)
}

.social-post:hover{
border-color:#dfe5f5
}

.social-brand{
font-size:25px;
font-weight:800;
letter-spacing:-1.2px;
color:var(--social)
}

.social-subtitle{
color:var(--mut);
font-size:13px
}

.social-wrap{
max-width:720px;
margin:0 auto
}

.social-composer{
display:flex;
gap:12px;
align-items:flex-start
}

.social-composer textarea{
min-height:84px;
resize:vertical;
margin:0
}

.social-actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:10px
}

.social-avatar{
flex:none;
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:50%;
background:linear-gradient(145deg,#3158d8,#8b5cf6);
color:#fff;
font-weight:800;
font-size:14px
}

.social-post{
margin-top:12px;
padding:16px;
animation:feed-in .24s ease both
}

@keyframes feed-in{
from{opacity:0;transform:translateY(7px)}
to{opacity:1;transform:translateY(0)}
}

.social-author{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.social-author b{
display:block;
font-size:14px
}

.social-copy{
white-space:pre-wrap;
overflow-wrap:anywhere;
margin:14px 0 12px;
font-size:14.5px;
line-height:1.6
}

.social-post-type{
display:inline-flex;
align-items:center;
gap:5px;
color:var(--social);
font-weight:700;
font-size:11px
}

.chat-layout{
display:grid;
grid-template-columns:minmax(230px,.8fr) minmax(0,1.2fr);
gap:14px;
min-height:420px
}

.chat-panel{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden
}

.chat-panel-head{
padding:14px 16px;
border-bottom:1px solid var(--line);
font-weight:800
}

.chat-contact{
width:100%;
display:flex;
align-items:center;
gap:10px;
padding:12px 14px;
text-align:left;
border-bottom:1px solid var(--line)
}

.chat-contact:hover,.chat-contact.active{
background:var(--social-soft)
}

.chat-contact-copy{
min-width:0;
flex:1
}

.chat-contact-copy b,.chat-contact-copy span{
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.chat-contact-copy span{
font-size:12px;
color:var(--mut)
}

.chat-preview{
height:355px;
overflow:auto;
padding:14px;
display:flex;
flex-direction:column;
gap:8px
}

.chat-bubble{
max-width:84%;
align-self:flex-start;
padding:10px 12px;
border-radius:16px 16px 16px 5px;
background:var(--bg);
overflow-wrap:anywhere;
white-space:pre-wrap
}

.chat-bubble.mine{
align-self:flex-end;
background:var(--social);
color:#fff;
border-radius:16px 16px 5px 16px
}

.chat-bubble time{
display:block;
margin-top:4px;
font-size:10px;
opacity:.7
}

.chat-compose{
display:flex;
align-items:flex-end;
gap:8px;
padding:12px;
border-top:1px solid var(--line)
}

.chat-compose textarea{
min-height:44px;
max-height:120px;
resize:vertical;
margin:0
}

.chat-compose .btn{
flex:none;
padding:11px 14px
}

@media(max-width:620px){
#app{padding:14px 12px calc(100px + env(safe-area-inset-bottom,0px))}
.app-topbar{
top:env(safe-area-inset-top,0px);
padding:9px 12px;
gap:7px
}
.app-brand{gap:6px}
.app-brand-mark{width:74px;height:30px}
.app-brand-copy b{font-size:11px}
.app-brand-copy span{display:none}
.app-user{gap:6px;font-size:11px}
.app-user-name{max-width:75px}
.app-user .badge{padding:2px 6px;font-size:9px}
.app-user-avatar{width:30px;height:30px}
.nav{padding:5px 4px calc(5px + env(safe-area-inset-bottom,0px))}
.nav div{gap:1px}
.nav button{flex:1 1 0;min-width:0;padding:6px 1px;font-size:8.5px}
.nav button span{font-size:17px}
.home-welcome{padding:16px;min-height:96px}
.home-welcome h1{font-size:21px}
.home-progress{padding:15px}
.social-brand{font-size:21px}
.social-actions{align-items:stretch;flex-direction:column}
.social-actions .btn{width:100%}
.social-subtitle{font-size:12px}
.social-avatar{width:36px;height:36px;font-size:12px}
.social-post{padding:14px}
.social-copy{font-size:14px;margin:12px 0}
.chat-layout{grid-template-columns:1fr;min-height:0}
.chat-preview{height:min(48vh,360px)}
.chat-layout.has-peer .chat-panel:first-child{display:none}
.chat-back{display:inline-flex!important}
.login-shell{padding:20px 16px}
.login-brand{height:112px;border-radius:17px}
.login-heading{margin-top:16px}
.login-heading h1{font-size:22px}
.login-card{padding:16px;border-radius:18px}
}

@media(hover:hover){
.card:hover{
border-color:color-mix(in srgb,var(--pri) 22%,var(--line));
box-shadow:0 14px 36px rgba(24,35,70,.09)
}
}

@media(prefers-reduced-motion:reduce){
.social-post,.card{animation:none;transition:none}
}
</style>
</head>

<body>

<header id="appHeader" class="app-topbar" hidden></header>

<div id="app"></div>

<div class="nav">
<div id="nav"></div>
</div>

<button class="fab" id="fab" aria-label="Tambah">+</button>

<div id="layer"></div>

<script>

const ST={
new:'New Lead',
contacted:'Contacted',
warm:'Warm Lead',
hot:'HOT LEAD',
followup:'Follow Up',
deal:'Deposit',
lost:'Lost'
};

const COL={
new:'--new',
contacted:'--contacted',
warm:'--warm',
hot:'--hot',
followup:'--followup',
deal:'--deal',
lost:'--lost'
};

const SRC=[
'WhatsApp',
'Facebook',
'Instagram',
'TikTok',
'Telegram',
'YouTube',
'Referral',
'Webinar/Event',
'Posting pribadi',
'Lainnya'
];

const ACT={
call:'📞 Telepon',
wa:'💬 Chat WhatsApp',
meet:'🤝 Bertemu',
post:'🔗 Posting',
shot:'📸 Screenshot'
};

const $=s=>document.querySelector(s);

const lday=x=>
x.getFullYear()+
'-'+
String(x.getMonth()+1).padStart(2,'0')+
'-'+
String(x.getDate()).padStart(2,'0');

const iso=(d=0)=>{
const x=new Date();
x.setDate(x.getDate()+d);
return lday(x)
};

const fmt=d=>
d
?new Date(d+'T00:00').toLocaleDateString(
'id-ID',
{
day:'numeric',
month:'short',
year:'numeric'
}
)
:'-';

const esc=s=>
String(s??'').replace(
/[&<>"]/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c])
);

function renderAppHeader(){

const header=$('#appHeader');

if(!header)return;

$('#app').classList.remove('login-screen');

header.hidden=!TOK;

if(!TOK)return;

header.innerHTML=`
<div class="app-brand">
<img class="app-brand-mark" src="tpfxlogo.jpg" alt="Logo TPFX">
<div class="app-brand-copy">
<b>Sales Workspace</b>
<span>Team community</span>
</div>
</div>
<div class="app-user">
<span class="app-user-name">${esc(S.name)}</span>
<span class="badge s-contacted">${esc(ROLE||'BDO')}</span>
<span class="app-user-avatar">${esc(initials(S.name))}</span>
</div>
`;

}


let S,
tab='feed',
flt='all',
srt='new',
q='',
per='hari',
USER='',
FEED=[],
CHAT_MESSAGES=[],
CHAT_TIMER=null;

function seed(){
return{
name:'Sales',
target:10,
leads:[],
acts:[]
}
}

S=seed();

let TOK='',
t,
ROLE='';

try{
TOK=
localStorage.getItem('swt')||
'';
}catch(e){}


// ============================================================
// API URL BARU
// ============================================================

const API=
'https://script.google.com/macros/s/AKfycbwCiMQjyvd_GHqc-TOzofoDEcpOj_-_uxs2ciX4wZG7VuG3hoZlInRuyO3cmPxSWS6F/exec';


// ============================================================
// RPC
// ============================================================

const rpc=async(fn,...a)=>{

if(
API.indexOf('PASTE')==0
){
throw new Error(
'API URL belum diisi di index.html'
);
}

let r,
j,
txt='';

try{

r=await fetch(
API,
{
method:'POST',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:JSON.stringify({
fn,
args:a
}),

cache:'no-store'
}
);

txt=await r.text();

try{

j=JSON.parse(txt);

}catch(e){

throw new Error(
'Server tidak mengirim JSON valid ('+
r.status+
'). Silakan coba lagi.'
);

}

}catch(e){

throw e;

}

if(
!j ||
typeof j!='object'
){

throw new Error(
'Server mengirim respons yang tidak valid untuk "'+
fn+
'".'
);

}

if(j.error){

throw new Error(
j.error
);

}

if(
!Object.prototype.hasOwnProperty.call(j,'result') ||
typeof j.result=='undefined'
){

throw new Error(
'Apps Script tidak mengembalikan hasil untuk "'+
fn+
'". Pastikan endpoint terdaftar di api_(), mengembalikan nilai, lalu deploy versi terbaru.'
);

}

return j.result;

};


// ============================================================
// SAVE

clearTimeout(t);

t=setTimeout(

()=>{

rpc(

)

.then(

r=>{

r.err==='AUTH'
){

r &&
r.err

// ============================================================

async function boot(){

if(!TOK){

return loginView();

}

try{

const r=
await rpc(
'loadState',
TOK
);

if(!r || typeof r!='object'){

throw new Error(
'Endpoint loadState mengembalikan respons kosong. Periksa fungsi loadState di Apps Script dan deploy ulang.'
);

}


if(
r &&
r.err==='AUTH'
){

TOK='';

try{

localStorage.removeItem(
'swt'
);
localStorage.removeItem(
'swt_user'
);

}catch(e){}

return loginView(
'Sesi telah berakhir. Silakan login kembali.'
);

}


if(
r &&
r.err
){

throw new Error(
r.err
);

}


if(
!r.user ||
!r.name ||
!r.role ||
!Object.prototype.hasOwnProperty.call(r,'state') ||
(
r.state &&
(
!Array.isArray(r.state.leads) ||
!Array.isArray(r.state.acts)
)
)
){

throw new Error(
'Format respons loadState tidak lengkap. Periksa endpoint loadState di Apps Script dan deploy ulang.'
);

}

S=
r.state &&
Array.isArray(r.state.leads) &&
Array.isArray(r.state.acts)
?r.state
:seed();

USER=
r.user||
'';

S.name=
r.name ||
S.name ||
'Sales';


ROLE=
r.role ||
'BDO';

renderAppHeader();


try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
r.user||''
);

}catch(e){}


document
.querySelector('.nav')
.style.display='';


$('#fab').style.display=
(
ROLE=='DM' ||
ROLE=='BM'
)
?'none'
:'';


if(
ROLE=='DM' ||
ROLE=='BM'
){

await loadTeam();

}

render();

if(tab=='feed'){
loadSocialFeed();
}


}catch(e){

const msg=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);


// Jangan menghapus token.
// Error JSON/network tidak membuat user
// harus login ulang.

sessionError(
msg
);

}

}

async function doLogin(){

const u=
$('#lu').value.trim();

const p=
$('#lp').value;


if(
!u ||
!p
){

$('#le').textContent=
'Isi username dan password';

return;

}


try{

const r=
await rpc(
'login',
u,
p
);


if(r.err){

$('#le').textContent=
'Username atau password salah';

return;

}


TOK=
r.token;


try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
u
);

}catch(e){}


await boot();


}catch(e){

$('#le').textContent=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);

}

}

async function refreshChatHistory(){

if(!(tab=='chat'||dmTab=='chat'))return;

try{

const r=await rpc(
'broadcastHistory',
TOK
);

if(!r||typeof r!='object'){
throw new Error('Format respons riwayat pesan tim tidak valid.');
}

if(r.err){
if(r.err=='AUTH'){
logout();
return;
}
throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat pesan');
}

if(!Array.isArray(r.rows)){
throw new Error('Endpoint broadcastHistory harus mengembalikan rows berupa array.');
}

const box=$('chatPreview');
const shouldScroll=!box||box.scrollHeight-box.scrollTop-box.clientHeight<60;
CHAT_MESSAGES=Array.isArray(r.rows)?r.rows:[];

if(box){
box.innerHTML=CHAT_MESSAGES.map(m=>`
<div class="chat-bubble ${m.from==USER?'mine':''}">
<b>${esc(m.nama||m.from||'Anggota TPFX')}</b>
${esc(m.text)}
<time>${socialTime(m.ts)}</time>
</div>
`).join('')||'<div class="empty">Belum ada pengumuman tim.</div>';
if(shouldScroll)scrollChatToBottom();
}

}catch(e){
toast('Chat gagal diperbarui: '+String((e&&e.message)||e));
}

}


async function sendTeamMessage(event){

event.preventDefault();
const input=$('#chatText');
const text=input.value.trim();

if(!text)return;

try{

const r=await rpc(
'sendBroadcast',
TOK,
text
);

if(!r||typeof r!='object'){
throw new Error('Format respons sendBroadcast tidak valid.');
}

if(r.err){
if(r.err=='AUTH'){
logout();
return;
}
toast(typeof r.err=='string'?r.err:'Pesan gagal dikirim');
return;
}

if(r.ok!==1){
throw new Error('Apps Script belum mengonfirmasi pengiriman broadcast.');
}

input.value='';
await loadBroadcastHistory();

}catch(e){

toast('Broadcast gagal dikirim: '+String((e&&e.message)||e));

}

}

function leads(){

.filter(
l=>
flt=='all' ||

:l.status==flt
)

.filter(
l=>
!q ||
(
l.name+
l.phone+
l.product
)
.toLowerCase()
.includes(
q.toLowerCase()
)
);


const sorts={

new:
(a,b)=>
b.c.localeCompare(a.c) ||
b.id-a.id,

last:
(a,b)=>
(b.last||'')
.localeCompare(
a.last||''
),

fu:
(a,b)=>
(a.next||'9')
.localeCompare(
b.next||'9'
),

hot:
(a,b)=>
(b.status=='hot')-
(a.status=='hot'),

pot:
(a,b)=>
[
'Rendah',
'Sedang',
'Tinggi'
].indexOf(b.interest)-
[
'Rendah',
'Sedang',
'Tinggi'
].indexOf(a.interest)

L.sort(
sorts[srt]
);

function pick(el){

const f=
el.files[0];

if(!f)return;


const r=
new FileReader();


r.onload=()=>{

const i=
new Image();


i.onload=()=>{

const c=
document.createElement(
'canvas'
);

const s=
Math.min(
1,
700/i.width
);

c.width=
i.width*s;

c.height=
i.height*s;


c.getContext(
'2d'
).drawImage(
i,
0,
0,
c.width,
c.height
);


img=
c.toDataURL(
'image/jpeg',
.6
);


$('#pv').src=
img;

$('#pv')
.style.display=
'block';

};


i.src=
r.result;

};


r.readAsDataURL(f);

}

async function createAccount(){

const u=
$('#au').value.trim();

const n=
$('#an').value.trim();

const r=
$('#ar').value;

const p=
$('#ap').value;


if(
!u ||
!n ||
!p
){

toast(
'Lengkapi semua data'
);

return;

}


if(
p.length<6
){

toast(
'Password minimal 6 karakter'
);

return;

}


try{

const x=
await rpc(
'createUser',
TOK,
u,
p,
n,
r
);


if(x.err){

toast(
x.err
);

return;

}


closeS();

toast(
'Akun berhasil dibuat'
);

accountManager();


}catch(e){

toast(
'Gagal membuat akun: '+
String((e&&e.message)||e)
);

}

}


async function deleteAccount(username){

if(
!username ||
String(username).toLowerCase()==
String(USER).toLowerCase()
){

toast(
'Akun yang sedang digunakan tidak dapat dihapus'
);

return;

}


if(
!confirm(
'Hapus akun @'+username+' beserta seluruh data akun tersebut?'
)
){

return;

}


try{

const r=
await rpc(
'deleteUser',
TOK,
username
);

if(r.err){

toast(
typeof r.err=='string'
?r.err
:'Gagal menghapus akun'
);

return;

}

toast(
'Akun @'+username+' berhasil dihapus'
);

await accountManager();

}catch(e){

toast(
'Gagal menghapus akun: '+
String((e&&e.message)||e)
);

}

}
