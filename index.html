<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>TPFX Sales Workspace</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3158d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="pwa-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="icon" type="image/jpeg" href="tpfxlogo.jpg">

<style>
:root{
color-scheme:light;
--bg:#f7f9fc;
--card:#fff;
--ink:#192238;
--mut:#758096;
--line:#e8ebf2;
--pri:#1d9bf0;
--new:#8a93a8;
--contacted:#2f7bea;
--warm:#f08a1c;
--hot:#e53935;
--followup:#7c4dff;
--deal:#1f9d55;
--lost:#4a5060;
--social:#1d9bf0;
--social-soft:#e8f5fd;
--shadow:0 1px 3px rgba(15,20,25,.08);
box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px)
}

*{
box-sizing:border-box;
margin:0
}

html,body{
height:100%
}

body{
background:var(--bg);
color:var(--ink);
font:14px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;
-webkit-tap-highlight-color:transparent
}

#app{
max-width:900px;
margin:0 auto;
padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))
}

#app.login-screen{
max-width:none;
padding:0
}

body.booting .nav{
display:none
}

.boot-surface{
max-width:900px;
margin:0 auto;
padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))
}

.boot-brand{
display:flex;
align-items:center;
gap:12px;
margin:4px 0 28px
}

.boot-brand img{
width:112px;
height:40px;
object-fit:cover;
border-radius:8px
}

.boot-copy{
display:grid;
gap:7px
}

.boot-copy b{font-size:14px}
.boot-copy span{color:var(--mut);font-size:12px}

.boot-title{
width:min(68%,300px);
height:25px;
margin-bottom:8px
}

.boot-subtitle{
width:min(88%,420px);
height:14px;
margin-bottom:20px
}

.boot-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px
}

.boot-card{
min-height:106px;
padding:16px;
border:1px solid var(--line);
border-radius:18px;
background:var(--card);
box-shadow:var(--shadow)
}

.boot-card.wide{
grid-column:1/-1;
min-height:184px
}

.boot-line{
height:12px;
margin:9px 0;
border-radius:8px
}

.boot-line.short{width:42%}
.boot-line.medium{width:68%}
.boot-line.long{width:90%}

.boot-skeleton{
background:linear-gradient(90deg,#eef1f7 25%,#f7f8fb 38%,#eef1f7 63%);
background-size:400% 100%;
animation:boot-shimmer 1.4s ease infinite
}

@keyframes boot-shimmer{
0%{background-position:100% 0}
100%{background-position:0 0}
}

@media(max-width:620px){
.boot-surface{padding:16px 12px calc(100px + env(safe-area-inset-bottom,0px))}
.boot-brand{margin-bottom:24px}
.boot-brand img{width:76px;height:30px}
.boot-card{min-height:92px;padding:13px}
}

@media(prefers-reduced-motion:reduce){
.boot-skeleton{animation:none}
}

.app-topbar{
position:sticky;
top:0;
z-index:4;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
max-width:900px;
margin:0 auto;
padding:12px 20px;
border-bottom:1px solid rgba(232,235,242,.9);
background:rgba(255,255,255,.96);
backdrop-filter:blur(14px)
}

.app-brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.app-brand-mark{
width:116px;
height:40px;
display:block;
flex:none;
border-radius:8px;
object-fit:cover;
object-position:center;
background:#fff
}

.app-brand-copy b,.app-brand-copy span{
display:block;
white-space:nowrap
}

.app-brand-copy b{
font-size:14px;
line-height:1.2
}

.app-brand-copy span{
margin-top:2px;
color:var(--mut);
font-size:10.5px
}

.app-user{
display:flex;
align-items:center;
gap:9px;
min-width:0;
font-weight:700;
font-size:12px
}

.app-user-name{
max-width:180px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.app-user-avatar{
width:34px;
height:34px;
display:grid;
place-items:center;
flex:none;
border:2px solid #e8edff;
border-radius:50%;
background:#f0f4ff;
color:var(--pri);
font-size:11px;
font-weight:800
}

.app-user-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.app-topbar[hidden]{
display:none
}

.login-shell{
min-height:100vh;
min-height:100dvh;
max-width:460px;
margin:0 auto;
padding:28px 16px;
display:flex;
flex-direction:column;
justify-content:center
}

.login-brand{
width:100%;
height:128px;
display:block;
object-fit:cover;
object-position:center;
background:#fff;
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow)
}

.login-heading{
margin-top:20px
}

.login-heading h1{
font-size:25px
}

.login-card{
margin-top:18px;
padding:18px
}

.login-card input{
min-height:48px
}

h1{
font-size:22px;
font-weight:800;
letter-spacing:-.03em;
line-height:1.2
}

h2{
font-size:15px;
font-weight:800;
margin:20px 0 10px
}

.mut{
color:var(--mut);
font-size:12.5px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:14px;
box-shadow:var(--shadow);
transition:border-color .18s,box-shadow .18s,transform .18s
}

.row{
display:flex;
align-items:center;
gap:10px
}

.sp{
justify-content:space-between
}

button{
font:inherit;
cursor:pointer;
border:0;
color:inherit;
background:none
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
outline:2px solid var(--pri);
outline-offset:2px
}

.btn{
background:var(--pri);
color:#fff;
font-weight:700;
border-radius:999px;
padding:11px 16px;
box-shadow:none
}

.btn.sec{
background:var(--bg);
color:var(--ink);
border:1px solid var(--line)
}

.btn.wa{
background:#1f9d55
}

.dm-lead-actions{
justify-content:flex-end;
margin-top:12px;
padding-top:12px;
border-top:1px solid var(--line)
}

.dm-whatsapp-cta{
display:inline-flex;
align-items:center;
justify-content:center;
gap:9px;
min-height:42px;
padding:8px 16px;
border:1px solid #14804a;
border-radius:12px;
background:linear-gradient(135deg,#168b50,#0d7540);
color:#fff;
font-size:13px;
font-weight:800;
text-decoration:none;
box-shadow:0 3px 8px rgba(13,117,64,.17);
transition:background .16s ease,box-shadow .16s ease,transform .16s ease
}

.dm-whatsapp-cta svg{
width:19px;
height:19px;
flex:none;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

.dm-whatsapp-cta:hover{
background:linear-gradient(135deg,#117b46,#096536);
box-shadow:0 5px 12px rgba(13,117,64,.24);
transform:translateY(-1px)
}

.dm-whatsapp-cta:focus-visible{
outline:2px solid #128c55;
outline-offset:3px
}

.dm-lead-actions .mut{
margin-right:auto
}

.btn.big{
width:100%;
padding:15px;
font-size:15px;
border-radius:14px
}

.badge{
display:inline-block;
font-size:11px;
font-weight:800;
color:#fff;
border-radius:99px;
padding:2px 9px
}

.s-new{background:var(--new)}
.s-contacted{background:var(--contacted)}
.s-warm{background:var(--warm)}
.s-hot{background:var(--hot)}
.s-followup{background:var(--followup)}
.s-deal{background:var(--deal)}
.s-lost{background:var(--lost)}

.prog{
height:10px;
border-radius:9px;
background:var(--line);
overflow:hidden;
margin-top:10px
}

.prog i{
display:block;
height:100%;
background:var(--pri);
border-radius:9px;
transition:width .4s
}

.big-n{
font-size:34px;
font-weight:800;
letter-spacing:-.03em;
line-height:1
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
text-align:left;
width:100%;
border:1px solid var(--line);
border-top:3px solid var(--c);
border-radius:18px;
box-shadow:var(--shadow)
}

.stat b{
font-size:24px;
display:block;
font-weight:800
}

.qa{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:4px;
scrollbar-width:none
}

.qa button{
flex:none;
background:var(--card);
border:1px solid var(--line);
border-radius:12px;
padding:9px 13px;
font-weight:600;
white-space:nowrap
}

.lead{
display:block;
width:100%;
text-align:left;
margin-bottom:10px;
border-left:4px solid var(--c)
}

.lead .n{
font-weight:800;
font-size:15px
}

.lead .meta{
display:grid;
grid-template-columns:auto 1fr;
gap:2px 10px;
margin:8px 0;
font-size:12.5px
}

.lead .meta span:nth-child(odd){
color:var(--mut)
}

.note{
font-style:italic;
color:var(--mut);
font-size:12.5px
}

.chips{
display:flex;
gap:6px;
overflow-x:auto;
margin:10px 0;
scrollbar-width:none
}

.chip{
flex:none;
padding:6px 13px;
border-radius:99px;
border:1px solid var(--line);
background:var(--card);
font-weight:600;
font-size:12.5px
}

.chip.on{
background:var(--ink);
color:var(--bg);
border-color:var(--ink)
}

input,select,textarea{
font:inherit;
width:100%;
padding:11px 12px;
border:1px solid var(--line);
border-radius:12px;
background:var(--card);
color:var(--ink)
}

label{
display:block;
font-weight:700;
font-size:12.5px;
margin:12px 0 5px
}

.kan{
display:flex;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
padding-bottom:8px;
margin:0 -16px;
padding:0 16px
}

.col{
flex:none;
width:260px;
scroll-snap-align:start;
background:var(--line);
border-radius:16px;
padding:10px
}

.col .lead{
padding:10px
}

.nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:color-mix(in srgb,var(--card) 96%,transparent);
border-top:1px solid var(--line);
padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));
backdrop-filter:blur(16px);
z-index:5
}

.nav div{
max-width:900px;
margin:0 auto;
display:flex;
overflow-x:auto;
scrollbar-width:none
}

.nav div::-webkit-scrollbar{
display:none
}

.nav button{
position:relative;
flex:1 0 62px;
padding:7px 3px;
font-size:10.5px;
font-weight:600;
color:var(--mut);
display:flex;
flex-direction:column;
align-items:center;
gap:3px
}

.nav button svg{
width:21px;
height:21px;
fill:none;
stroke:currentColor;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round
}

.nav button.on{
color:var(--ink);
font-weight:800
}

.nav button.on svg{
stroke-width:2.2
}

.nav button .nav-badge{
position:absolute;
margin:-2px 0 0 22px;
min-width:17px;
padding:1px 5px;
border-radius:99px;
background:var(--hot);
color:#fff;
font-size:10px;
font-weight:800
}

.app-quick-add{
flex:none;
width:36px;
height:36px;
display:grid;
place-items:center;
border:0;
border-radius:12px;
background:var(--pri);
color:#fff;
font-size:23px;
font-weight:700;
line-height:1;
box-shadow:0 8px 18px -10px rgba(39,67,214,.95)
}

.ov{
position:fixed;
inset:0;
background:rgba(10,14,30,.5);
z-index:9;
display:flex;
align-items:flex-end;
justify-content:center
}

.sheet{
background:var(--bg);
width:100%;
max-width:720px;
max-height:92vh;
overflow:auto;
border-radius:22px 22px 0 0;
padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
animation:up .22s ease
}

@keyframes up{
from{
transform:translateY(40px);
opacity:0
}
}

@media(prefers-reduced-motion:reduce){
.sheet{animation:none}
.prog i{transition:none}
}

.opt{
width:100%;
text-align:left;
padding:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
margin-top:8px;
font-weight:700
}

.bars{
display:flex;
align-items:flex-end;
gap:5px;
height:70px;
margin-top:10px
}

.bars div{
flex:1;
background:var(--pri);
border-radius:5px 5px 0 0;
min-height:3px;
opacity:.85
}

.act{
display:flex;
gap:10px;
padding:11px 0;
border-bottom:1px solid var(--line)
}

.act img{
width:56px;
height:56px;
object-fit:cover;
border-radius:10px
}

.empty{
text-align:center;
padding:28px 10px;
color:var(--mut)
}

.toast{
position:fixed;
left:50%;
bottom:150px;
transform:translateX(-50%);
background:var(--ink);
color:var(--bg);
padding:9px 16px;
border-radius:99px;
font-weight:700;
z-index:20
}

.tl{
border-left:2px solid var(--line);
padding-left:12px;
margin-left:4px
}

.tl p{
margin-bottom:8px;
font-size:12.5px
}

.social-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin:0;
padding:14px 16px;
border-bottom:1px solid var(--line)
}

.home-welcome{
position:relative;
overflow:hidden;
min-height:110px;
padding:20px;
border-color:#e6eafa;
background:
radial-gradient(circle at 92% 10%,rgba(49,88,216,.09),transparent 135px),
#fff
}

.home-welcome h1{
max-width:600px;
font-size:25px
}

.home-welcome .mut{
margin-top:7px
}

.home-progress{
padding:18px 20px;
border-color:#e6eafa;
background:linear-gradient(110deg,#fff 0%,#fff 74%,#f5f7ff 100%)
}

.home-progress .big-n{
color:var(--pri)
}

.deposit-ticker{
display:flex;
align-items:center;
gap:10px;
margin-top:14px;
padding:8px 10px 8px 12px;
border:1px solid rgba(56,189,248,.28);
border-radius:16px;
background:linear-gradient(105deg,#081c33 0%,#12385e 52%,#0b6b78 100%);
box-shadow:0 10px 24px rgba(8,47,73,.22);
overflow:hidden
}

.deposit-ticker-label{
flex:none;
display:inline-flex;
align-items:center;
gap:6px;
padding:4px 10px;
border-radius:999px;
border:1px solid rgba(125,211,252,.35);
background:rgba(56,189,248,.14);
color:#bae6fd;
font-size:10px;
font-weight:800;
letter-spacing:.1em
}

.deposit-ticker-label:before{
content:'●';
font-size:8px;
color:#34d399;
animation:depositBlink 1.6s ease-in-out infinite
}

@keyframes depositBlink{50%{opacity:.2}}

.deposit-ticker-head{
display:flex;
align-items:center;
gap:10px;
flex:none;
min-width:0
}

.deposit-ticker-market{
display:inline-flex;
align-items:center;
gap:6px;
padding:3px 9px 3px 8px;
border:1px solid rgba(94,234,212,.22);
border-radius:999px;
background:rgba(15,118,110,.24);
white-space:nowrap
}

.deposit-ticker-symbol{
font-size:9px;
font-weight:900;
letter-spacing:.09em;
color:#7dd3fc
}

.deposit-ticker-price{
color:#ecfeff;
font-size:12.5px;
font-weight:900;
font-variant-numeric:tabular-nums;
letter-spacing:-.01em
}

.deposit-ticker-live{
display:inline-flex;
align-items:center;
gap:4px;
color:#6ee7b7;
font-size:8px;
font-weight:900;
letter-spacing:.1em
}

.deposit-ticker-live i{
width:5px;
height:5px;
border-radius:50%;
background:#34d399;
box-shadow:0 0 0 3px rgba(52,211,153,.16);
animation:depositBlink 1.6s ease-in-out infinite
}

.deposit-ticker-caption{
overflow:hidden;
color:#7dd3fc;
font-size:10px;
font-weight:700;
letter-spacing:.04em;
white-space:nowrap;
text-overflow:ellipsis
}

.deposit-ticker-window{
flex:1;
min-width:0;
overflow:hidden;
white-space:nowrap;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);
mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)
}

.deposit-ticker-track{
display:inline-flex;
width:max-content;
animation:depositTicker 32s linear infinite
}

.deposit-ticker-group{display:inline-flex;padding-left:18px}

.deposit-ticker:hover .deposit-ticker-track{animation-play-state:paused}

.deposit-ticker-item{
display:inline-flex;
align-items:baseline;
gap:0;
padding-right:38px;
color:#dbeafe;
font-size:12px;
font-weight:600
}

.deposit-ticker-item b{
color:#fff;
font-weight:800;
letter-spacing:.01em
}

.deposit-ticker-sep{
margin:0 8px;
color:#7dd3fc;
opacity:.6
}

.deposit-ticker-amount{
color:#5eead4;
font-weight:800;
font-variant-numeric:tabular-nums
}

.deposit-ticker-news{
color:#e0f2fe;
text-decoration:none;
transition:color .2s
}

.deposit-ticker-news:hover,
.deposit-ticker-news:focus-visible{
color:#fff
}

.deposit-ticker-news:focus-visible{
outline:2px solid #7dd3fc;
outline-offset:3px;
border-radius:8px
}

.deposit-ticker-tag{
flex:none;
margin-right:8px;
padding:1px 7px;
border-radius:999px;
background:linear-gradient(90deg,#f59e0b,#fbbf24);
color:#3b2603;
font-size:9px;
font-weight:900;
letter-spacing:.08em
}

.deposit-ticker-news-title{
max-width:min(70vw,560px);
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
display:inline-block;
vertical-align:bottom
}

.deposit-ticker-source{
color:#fcd34d;
font-weight:700;
opacity:.85
}

.deposit-ticker-empty{color:#cbd5e1;font-weight:600}

@keyframes depositTicker{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}

@media (max-width:640px){
.deposit-ticker{
flex-direction:column;
align-items:stretch;
gap:6px;
margin-top:12px;
padding:8px 11px 9px;
border-radius:14px
}

.deposit-ticker-head{
width:100%;
justify-content:space-between;
padding-bottom:6px;
border-bottom:1px solid rgba(125,211,252,.16)
}

.deposit-ticker-label{
font-size:9px;
padding:4px 9px
}

.deposit-ticker-market{
margin-left:auto;
padding:2px 8px 2px 7px
}

.deposit-ticker-window{
-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);
mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)
}

.deposit-ticker-item{
font-size:11px;
padding-right:24px
}

.deposit-ticker-tag{
margin-right:6px;
padding:1px 6px;
font-size:8px
}

.deposit-ticker-news-title{
max-width:none;
overflow:visible;
text-overflow:clip
}

.deposit-ticker-source{display:none}
}

@media (prefers-reduced-motion:reduce){
.deposit-ticker-track{animation:none}
.deposit-ticker-window{overflow-x:auto}
}

.social-composer textarea{
border-radius:16px;
background:#f7f8fb
}

.social-post{
border-color:transparent;
border-radius:0;
box-shadow:none
}

.social-post:hover{
border-color:transparent;
background:#fbfcff
}

.social-brand{
font-size:25px;
font-weight:800;
letter-spacing:-1.2px;
color:var(--social)
}

.social-subtitle{
color:var(--mut);
font-size:13px
}

.social-wrap{
max-width:600px;
margin:0 auto
}

.social-composer{

const rpcFetch=async(timeout,fn,...a)=>{

if(
API.indexOf('PASTE')==0
){
throw new Error(
'API URL belum diisi di index.html'
);
}

let r,
j,
txt='';
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),timeout);

try{

r=await fetch(
API,
{
method:'POST',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:JSON.stringify({
fn,
args:a
}),

cache:'no-store',
signal:controller.signal
}
);

txt=await r.text();

try{

j=JSON.parse(txt);

}catch(e){

throw new Error(
'Server tidak mengirim JSON valid ('+
r.status+
'). Silakan coba lagi.'
);

}

}catch(e){

if(e&&e.name=='AbortError'){
throw new Error('Koneksi ke server terlalu lama. Periksa internet lalu coba lagi.');
}

throw e;

}finally{

clearTimeout(timer);

}

if(
!j ||
typeof j!='object'
){

throw new Error(
'Server mengirim respons yang tidak valid untuk "'+
fn+
'".'
);

}

if(j.error){

throw new Error(
j.error
);

}

if(
!Object.prototype.hasOwnProperty.call(j,'result') ||
typeof j.result=='undefined'
){

throw new Error(
'Apps Script tidak mengembalikan hasil untuk "'+
fn+
'". Pastikan endpoint terdaftar di api_(), mengembalikan nilai, lalu deploy versi terbaru.'
);

}

return j.result;

};

const rpc=(fn,...a)=>rpcFetch(30000,fn,...a);

r &&
r.err
){

);

(
r.state &&
(
!Array.isArray(r.state.leads) ||
!Array.isArray(r.state.acts)
)
)
){

);

}

S=
r.state &&
Array.isArray(r.state.leads) &&

if(Number.isFinite(Number(r.target))&&Number(r.target)>=1){

}

USER=
r.user||
'';

r.name ||
S.name ||
'Sales';

r.role ||

try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
r.user||''
);

}catch(e){}


document
.querySelector('.nav')

const manager=ROLE=='DM'||ROLE=='BM';
if(manager)TEAM=[];
render();

$('#app').setAttribute('aria-busy','false');

});
}

pollChatNotifications();

if(tab=='feed'){
loadSocialFeed();
}


}catch(e){

const msg=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);


// Jangan menghapus token.
// Error JSON/network tidak membuat user
// harus login ulang.

sessionError(
msg
);

}

}

async function doLogin(){

if(LOGIN_PENDING)return;

const u=
$('#lu').value.trim();

const p=
$('#lp').value;


if(
!u ||
!p
){

$('#le').textContent=
'Isi username dan password';

return;

}

primeNotificationPermission();

LOGIN_PENDING=true;
const button=$('#app .login-card .btn');
if(button){
button.disabled=true;
button.textContent='Memproses...';
}

try{

const r=
await rpc(
'login',
u,
p
);


if(r.err){

$('#le').textContent=
'Username atau password salah';

return;

}


TOK=
r.token;


try{

localStorage.setItem(
'swt',
TOK
);

localStorage.setItem(
'swt_user',
u
);

}catch(e){}


await boot();


}catch(e){

$('#le').textContent=
String(
(e&&e.message)||e
).replace(
/^Error:\s*/,
''
);

}finally{

LOGIN_PENDING=false;
const currentButton=$('#app .login-card .btn');
if(currentButton){
currentButton.disabled=false;
currentButton.textContent='Masuk';
}

}

}

'div'
);

}

function mergeFeedRows(rows){

const previousById=new Map(FEED.map(item=>[String(item.id),item]));
const serverRows=rows.filter(item=>
!String(item.id||'').startsWith('local-post-')
).map(item=>{
const previous=previousById.get(String(item.id));
return previous&&previous.commentsOpen
?Object.assign({},item,{
commentsOpen:true,
comments:Array.isArray(previous.comments)?previous.comments:[],
commentsLoading:Boolean(previous.commentsLoading),
commentsError:String(previous.commentsError||'')
})
:item;
});
const keep=[];
const now=Date.now();

FEED_LOCAL_ECHOES.forEach(local=>{
if(local.pending){
keep.push(local);
serverRows.push(local);
return;
}

const match=serverRows.findIndex(item=>
item.kind=='post' &&
String(item.username||'').toLowerCase()==String(local.username||'').toLowerCase() &&
String(item.text||'')==local.text &&
String(item.imageUrl||'')==String(local.imageUrl||'') &&
(Number(item.ts)||0)>=local.ts-5000 &&
(Number(item.ts)||0)<=local.ts+120000
);

if(match>=0){
return;
}

if(local.pending||now-local.ts<120000){
keep.push(local);
serverRows.push(local);
}
});

FEED_LOCAL_ECHOES=keep;
return serverRows.sort((a,b)=>
Number(Boolean(b.pinned))-Number(Boolean(a.pinned))||
(Number(b.ts)||0)-(Number(a.ts)||0)
);

}

function prepareFeedImage(input){
const file=input.files&&input.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){toast('Pilih file gambar.');input.value='';return;}
if(file.size>8*1024*1024){toast('Ukuran foto maksimal 8 MB.');input.value='';return;}
const reader=new FileReader();
reader.onerror=()=>toast('Foto gagal dibaca.');
reader.onload=()=>{
const image=new Image();
image.onerror=()=>toast('Format foto tidak dapat dibuka.');
image.onload=()=>{
const scale=Math.min(1,1200/image.width,1200/image.height);
const canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.width*scale));
canvas.height=Math.max(1,Math.round(image.height*scale));
const context=canvas.getContext('2d');
if(!context){toast('Browser tidak dapat memproses foto.');return;}
context.drawImage(image,0,0,canvas.width,canvas.height);
FEED_IMAGE=canvas.toDataURL('image/jpeg',.78);
render();
};
image.src=String(reader.result||'');
};
reader.readAsDataURL(file);
}


async function publishSocialPost(){

if(FEED_POSTING)return;
const input=$('#feedText');
const text=input.value.trim();
FEED_TEXT=text;

if(!text&&!FEED_IMAGE){
toast('Tulis isi postingan atau pilih foto terlebih dahulu');
return;
}

const local={
id:'local-post-'+Date.now()+'-'+Math.random().toString(36).slice(2),
username:USER,
nama:S.name,
text:text,
ts:Date.now(),
kind:'post',
photoUrl:'',
profilePhoto:PROFILE_PHOTO,
imageUrl:'',
pending:true
};

FEED_LOCAL_ECHOES.push(local);
FEED=mergeFeedRows(FEED);
FEED_POSTING=true;
const photo=FEED_IMAGE;
FEED_IMAGE='';
FEED_TEXT='';
input.value='';
if(tab=='feed'||dmTab=='feed')render();

try{

let photoUrl='';
if(photo){
photoUrl=await rpc('uploadImg',TOK,photo);
if(typeof photoUrl!='string'||!/^https?:\/\//i.test(photoUrl))throw new Error('Server tidak mengembalikan tautan foto yang valid.');
local.imageUrl=photoUrl;
}

const r=await rpc(
'createPost',
TOK,
text,
photoUrl
);

if(r.err){
if(r.err=='AUTH'){
FEED_LOCAL_ECHOES=FEED_LOCAL_ECHOES.filter(item=>item.id!=local.id);
FEED_POSTING=false;
logout();
return;
}
throw new Error(typeof r.err=='string'?r.err:'Postingan gagal disimpan');
}

if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi penyimpanan postingan.');

local.pending=false;
FEED_POSTING=false;
FEED=mergeFeedRows(FEED);
if(tab=='feed'||dmTab=='feed')render();
toast('Postingan dibagikan');

}catch(e){

if(isAuthError(e)){

logout('Sesi login berakhir. Silakan login kembali.');

return;

}

FEED_LOCAL_ECHOES=FEED_LOCAL_ECHOES.filter(item=>item.id!=local.id);
FEED=FEED.filter(item=>item.id!=local.id);
FEED_IMAGE=photo;
FEED_POSTING=false;
FEED_TEXT=text;
if(tab=='feed'||dmTab=='feed'){
render();
}
toast('Postingan gagal dikirim: '+String((e&&e.message)||e));

}

}

async function togglePostComments(postId){
const post=FEED.find(item=>String(item.id)==String(postId));
if(!post)return;
post.commentsOpen=!post.commentsOpen;
if(!post.commentsOpen){
renderSocialFeedList();
return;
}
const key=String(postId);
if(FEED_COMMENT_LOADING[key]){
renderSocialFeedList();
return;
}
FEED_COMMENT_LOADING[key]=true;
post.commentsLoading=true;
post.commentsError='';
renderSocialFeedList();
try{
await loadPostComments(postId);
}catch(e){
const latestPost=FEED.find(item=>String(item.id)==key);
if(latestPost){
latestPost.commentsLoading=false;
latestPost.commentsError=String((e&&e.message)||e);
}
toast('Komentar gagal dimuat: '+String((e&&e.message)||e));
}finally{
delete FEED_COMMENT_LOADING[key];
renderSocialFeedList();
}
}

async function retryPostComments(postId){
const post=FEED.find(item=>String(item.id)==String(postId));
if(!post||FEED_COMMENT_LOADING[String(postId)])return;
post.commentsLoading=true;
post.commentsError='';
FEED_COMMENT_LOADING[String(postId)]=true;
renderSocialFeedList();
try{
await loadPostComments(postId);
}catch(e){
post.commentsLoading=false;

]);

for(const r of results){

}

function chatSeenKey(){
return 'tpfx-chat-seen-'+String(USER||'').toLowerCase();
}


function chatNotifiedKey(){
return 'tpfx-chat-notified-'+String(USER||'').toLowerCase();
}


function readChatSeen(){
try{
const value=JSON.parse(localStorage.getItem(chatSeenKey())||'{}');
return value&&typeof value=='object'?value:{};
}catch(e){
return {};
}
}


function readChatNotified(){
try{
const value=JSON.parse(localStorage.getItem(chatNotifiedKey())||'{}');
return value&&typeof value=='object'?value:{};
}catch(e){
return {};
}
}


function writeChatSeen(seen){
try{
localStorage.setItem(chatSeenKey(),JSON.stringify(seen));
}catch(e){
console.error('Status baca chat tidak dapat disimpan:',e);
}
}


function writeChatNotified(notified){
try{
localStorage.setItem(chatNotifiedKey(),JSON.stringify(notified));
}catch(e){
console.error('Status notifikasi chat tidak dapat disimpan:',e);
}
}


function chatThreadKey(type,id){
return type+':'+String(id);
}


function initializeChatSeen(contacts,groups){
let storedSeen=null,storedNotified=null;
try{
storedSeen=localStorage.getItem(chatSeenKey());
storedNotified=localStorage.getItem(chatNotifiedKey());
}catch(e){
console.error('Status chat tidak dapat dimuat:',e);
}
const baseline={};
contacts.forEach(contact=>{
baseline[chatThreadKey('personal',contact.username)]=Number(contact.lastTs)||0;
});
groups.forEach(group=>{
baseline[chatThreadKey('group',group.id)]=Number(group.lastTs)||0;
});
baseline[chatThreadKey('global','global')]=0;
if(storedSeen===null)writeChatSeen(baseline);
if(storedNotified===null){
writeChatNotified(storedSeen===null?baseline:readChatSeen());
}
}


function markChatSeen(type,id,ts){
const seen=readChatSeen();
const key=chatThreadKey(type,id);
seen[key]=Math.max(Number(seen[key])||0,Number(ts)||0);
writeChatSeen(seen);
updateChatUnreadIndicators();
}


function chatUnread(type,item){
const id=type=='personal'?item.username:(item.id||'global');
return Number(item.lastTs)>0&&
String(item.lastFrom||'').toLowerCase()!=String(USER).toLowerCase()&&
Number(item.lastTs)>(Number(readChatSeen()[chatThreadKey(type,id)])||0);
}


function unreadChatCount(){
return CHAT_CONTACTS.filter(item=>chatUnread('personal',item)).length+
CHAT_GROUPS.filter(item=>chatUnread('group',item)).length+
(CHAT_GLOBAL&&chatUnread('global',CHAT_GLOBAL)?1:0);
}

function urlBase64ToUint8Array(base64String){
const padding='='.repeat((4-base64String.length%4)%4);
const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
const raw=atob(base64);
const output=new Uint8Array(raw.length);
for(let i=0;i<raw.length;i++)output[i]=raw.charCodeAt(i);
return output;
}


function isStandaloneApp(){
return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
}


function isIOSDevice(){
return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}


async function registerServiceWorker(){
if(!('serviceWorker' in navigator))return null;
try{
SW_REG=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
return SW_REG;
}catch(e){
console.warn('Service worker gagal didaftarkan:',e);
return null;
}
}


async function loadPushPublicKey(){
if(PUSH_PUBLIC_KEY)return PUSH_PUBLIC_KEY;
try{
const res=await fetch(new URL('./api/push',location.href),{cache:'no-store'});
if(!res.ok)return '';
const data=await res.json();
if(data&&data.enabled&&typeof data.publicKey==='string'&&data.publicKey){
PUSH_PUBLIC_KEY=data.publicKey;
}
}catch(e){}
return PUSH_PUBLIC_KEY;
}


async function subscribePushManager(){
const key=await loadPushPublicKey();
if(!key||!SW_REG)throw new Error('Notifikasi HP belum siap.');
let sub=await SW_REG.pushManager.getSubscription();
if(!sub){
sub=await SW_REG.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(key)});
}
const result=await sendPushSubscription(sub);
if(result&&result.err)throw new Error(typeof result.err==='string'?result.err:'Langganan push ditolak server.');
return sub;
}


function armPushAutoPrompt(){
if(PUSH_AUTO_ARMED||!TOK||!PUSH_ENABLED||PUSH_SUBSCRIBED)return;
if(!('Notification' in window)||Notification.permission!='default')return;
if(isIOSDevice()&&!isStandaloneApp())return;
PUSH_AUTO_ARMED=true;
const handler=()=>{
document.removeEventListener('pointerdown',handler,true);
document.removeEventListener('keydown',handler,true);
if(!TOK||PUSH_BUSY)return;
enablePushNotifications(true);
};
document.addEventListener('pointerdown',handler,true);
document.addEventListener('keydown',handler,true);
}


async function initPush(){
if(PUSH_CHECKED||!TOK)return;
try{
const cfg=await rpc('pushConfig',TOK);
PUSH_ENABLED=!!(cfg&&cfg.enabled);
}catch(e){
PUSH_ENABLED=false;
}
PUSH_CHECKED=true;
if(!PUSH_ENABLED){
refreshNotificationControl();
return;
}
if(!SW_REG)await registerServiceWorker();
const pushKey=await loadPushPublicKey();
if(!SW_REG||!pushKey){
PUSH_ENABLED=false;
refreshNotificationControl();
return;
}
try{
const sub=await SW_REG.pushManager.getSubscription();
if(sub){
PUSH_SUBSCRIBED=true;
sendPushSubscription(sub).catch(()=>{});
}else if(Notification.permission=='granted'){
await subscribePushManager();
PUSH_SUBSCRIBED=true;
}
}catch(e){
PUSH_SUBSCRIBED=false;
console.warn('Langganan notifikasi HP belum siap:',e);
}
if(!PUSH_SUBSCRIBED)armPushAutoPrompt();
refreshNotificationControl();
}


async function sendPushSubscription(sub){
const payload=sub&&typeof sub.toJSON==='function'?sub.toJSON():sub;
return rpc('subscribePush',TOK,JSON.stringify(payload));
}


async function enablePushNotifications(auto){
if(PUSH_BUSY)return;
if(!PUSH_ENABLED){
if(!auto)toast('Notifikasi HP belum aktif di server. Hubungi manager.');
return;
}
if(!('Notification' in window)){
if(!auto)toast('Browser ini tidak mendukung notifikasi.');
return;
}
if(Notification.permission=='denied'){
if(!auto)toast('Izin notifikasi diblokir. Ubah izin situs di pengaturan browser.');
return;
}
if(isIOSDevice()&&!isStandaloneApp()){
if(!auto)toast('Di iPhone, tambahkan aplikasi ke Layar Utama, buka dari ikonnya, lalu aktifkan notifikasi.');
return;
}
PUSH_BUSY=true;
try{
const permission=Notification.permission=='granted'?'granted':await Notification.requestPermission();
if(permission!='granted'){
if(!auto)toast(permission=='denied'?'Izin notifikasi diblokir. Ubah izin situs di pengaturan browser.':'Izin notifikasi belum diberikan.');
return;
}
if(!SW_REG)await registerServiceWorker();
if(!SW_REG)throw new Error('Service worker belum siap. Muat ulang aplikasi lalu coba lagi.');
await subscribePushManager();
PUSH_SUBSCRIBED=true;
toast('Notifikasi HP aktif. Pesan baru masuk walau aplikasi ditutup.');
}catch(e){
const msg=String((e&&e.message)||e);
if(msg.indexOf('tidak mengembalikan hasil')>=0)PUSH_ENABLED=false;
console.error('Aktivasi notifikasi HP gagal:',e);
if(!auto)toast('Notifikasi HP gagal diaktifkan: '+msg);
}finally{
PUSH_BUSY=false;
refreshNotificationControl();
}
}


function primeNotificationPermission(){
if(!('Notification' in window))return;
if(Notification.permission!='default')return;
if(isIOSDevice()&&!isStandaloneApp())return;
try{
const pending=Notification.requestPermission();
if(pending&&typeof pending.catch==='function')pending.catch(()=>{});
}catch(e){}
}

async function pollChatNotifications(){
if(!TOK||CHAT_NOTIFICATIONS_LOADING)return;
CHAT_NOTIFICATIONS_LOADING=true;
try{
const result=await rpc('chatNotificationSummary',TOK);
if(!result||typeof result!='object')throw new Error('Respons ringkasan notifikasi chat tidak valid.');
if(result.err){
if(result.err=='AUTH'){logout();return;}
throw new Error(typeof result.err=='string'?result.err:'Ringkasan chat tidak dapat dimuat');
}
if(!Array.isArray(result.contacts)||!Array.isArray(result.groups))throw new Error('Ringkasan chat harus mengembalikan contacts dan groups berupa array.');
const contacts=result.contacts,groups=result.groups,global=result.global||{id:'global',lastTs:0,lastFrom:'',lastText:''};
initializeChatSeen(contacts,groups);
CHAT_CONTACTS=contacts;
CHAT_GROUPS=groups;
CHAT_GLOBAL=global;
const seen=readChatSeen(),notified=readChatNotified();
const currentChatIsOpen=(type,id)=>
(document.visibilityState!='hidden'&&(tab=='chat'||dmTab=='chat'))&&CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&String(CHAT_ACTIVE.id)==String(id);
const incoming=[];
[['personal',contacts],['group',groups],['global',[global]]].forEach(([type,items])=>{
items.forEach(item=>{
const id=type=='personal'?item.username:(item.id||'global');
const key=chatThreadKey(type,id);
const lastTs=Number(item.lastTs)||0;
if(currentChatIsOpen(type,id)){
seen[key]=Math.max(Number(seen[key])||0,lastTs);
return;
}
if(lastTs>Math.max(Number(seen[key])||0,Number(notified[key])||0)&&String(item.lastFrom||'').toLowerCase()!=String(USER).toLowerCase()){
incoming.push({type,item,id,key,lastTs});
}
});
});
writeChatSeen(seen);
if('Notification' in window&&Notification.permission=='granted'){
// Saat push aktif dan halaman tidak terlihat, server push yang menampilkan
// notifikasi; jangan tampilkan duplikat dari polling lokal.
const pushHandles=PUSH_ENABLED&&PUSH_SUBSCRIBED&&document.visibilityState!='visible';
for(const message of incoming){
if(!pushHandles){
const title=message.type=='group'?message.item.name:message.item.nama;
const link=message.type=='group'
?'./index.html#chat=group:'+encodeURIComponent(message.id)
:message.type=='global'
?'./index.html#chat=global'
:'./index.html#chat=personal:'+encodeURIComponent(message.id);
await showLocalNotification(title||'Pesan baru',{
body:String(message.item.lastText||'Anda menerima pesan baru'),
tag:'tpfx-chat-'+message.key,
renotify:false
},link);
}
notified[message.key]=Math.max(Number(notified[message.key])||0,message.lastTs);
}
writeChatNotified(notified);
}
updateChatUnreadIndicators();
}catch(e){
const now=Date.now();
if(now-CHAT_NOTIFICATION_ERROR_AT>60000){
console.error('Notifikasi chat gagal diperbarui:',e);
CHAT_NOTIFICATION_ERROR_AT=now;
}
}finally{
CHAT_NOTIFICATIONS_LOADING=false;
}
}

function readChatCache(type,target){

return[];

function writeChatCache(type,target,messages){

async function openChatHistory(){

stopChatRecording(true);
CHAT_ATTACHMENT=null;
CHAT_MESSAGES=[];
CHAT_SYNC_CURSOR=0;
CHAT_OLDEST_ROW=0;
CHAT_HAS_MORE=false;
CHAT_SEARCH_QUERY='';
CHAT_SEARCH_REMOTE=[];
CHAT_SEARCH_LOADING=false;
CHAT_SEARCH_OPEN=false;
CHAT_EMOJI_OPEN=false;
clearTimeout(CHAT_SEARCH_TIMER);
if(ROLE=='DM'||ROLE=='BM')dmTab='chat';else tab='chat';
const requestId=++CHAT_HISTORY_REQUEST;
CHAT_HISTORY_LOADING=true;

try{
const type=CHAT_ACTIVE.type;
const target=CHAT_ACTIVE.id;
const cached=readChatCache(type,target);
if(cached.length)CHAT_MESSAGES=mergeChatRows(cached,type,target);
render();
scrollChatToBottom();
const r=await rpc(
type=='group'?'groupHistory':type=='global'?'globalChatHistory':'chatHistory',
TOK,
target,
0
);

if(!r||typeof r!='object')throw new Error('Format respons riwayat chat tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat pesan');
}
if(!Array.isArray(r.rows))throw new Error('Endpoint riwayat chat harus mengembalikan rows berupa array.');

if(requestId!=CHAT_HISTORY_REQUEST||!CHAT_ACTIVE||CHAT_ACTIVE.type!=type||CHAT_ACTIVE.id!=target)return;
CHAT_SYNC_CURSOR=Number(r.cursor)||0;
CHAT_HAS_MORE=!!r.hasMore;
CHAT_OLDEST_ROW=r.rows.length?Number(r.rows[0].row)||0:0;
CHAT_MESSAGES=mergeChatRows(r.rows,type,target);
writeChatCache(type,target,CHAT_MESSAGES);
markChatSeen(type,target,CHAT_MESSAGES.reduce((latest,message)=>Math.max(latest,Number(message.ts)||0),0));
render();
scrollChatToBottom();
}catch(e){
if(requestId==CHAT_HISTORY_REQUEST)toast('Pesan gagal dimuat: '+String((e&&e.message)||e));
}finally{
if(requestId==CHAT_HISTORY_REQUEST){
CHAT_HISTORY_LOADING=false;
renderChatMessages();
}
}

}

async function loadOlderChat(){
if(CHAT_HISTORY_LOADING||!CHAT_HAS_MORE||!CHAT_ACTIVE)return;
CHAT_HISTORY_LOADING=true;
const type=CHAT_ACTIVE.type,target=CHAT_ACTIVE.id;
const requestId=CHAT_HISTORY_REQUEST;
const beforeRow=CHAT_OLDEST_ROW;
const box=$('#chatPreview');
const oldHeight=box?box.scrollHeight:0;
const oldTop=box?box.scrollTop:0;
try{
const endpoint=type=='group'?'groupHistory':type=='global'?'globalChatHistory':'chatHistory';
const result=await rpc(endpoint,TOK,target,beforeRow);
if(!result||typeof result!='object')throw new Error('Respons riwayat lama tidak valid.');
if(result.err){
if(result.err=='AUTH'){logout();return;}
throw new Error(typeof result.err=='string'?result.err:'Riwayat lama gagal dimuat');
}
if(!Array.isArray(result.rows))throw new Error('Respons riwayat lama tidak valid.');
if(requestId!=CHAT_HISTORY_REQUEST||!CHAT_ACTIVE||CHAT_ACTIVE.type!=type||CHAT_ACTIVE.id!=target)return;
CHAT_HAS_MORE=!!result.hasMore;
if(result.rows.length)CHAT_OLDEST_ROW=Number(result.rows[0].row)||CHAT_OLDEST_ROW;
CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES.concat(result.rows),type,target);
writeChatCache(type,target,CHAT_MESSAGES);
renderChatMessages();
const updated=$('#chatPreview');
if(updated)updated.scrollTop=updated.scrollHeight-oldHeight+oldTop;
}catch(e){toast('Pesan lama gagal dimuat: '+String((e&&e.message)||e));}
finally{if(requestId==CHAT_HISTORY_REQUEST)CHAT_HISTORY_LOADING=false;}
}


function mergeChatRows(rows,type,target){

const serverRows=rows.filter(item=>
!String(item.id||'').startsWith('local-message-')
);
const now=Date.now();

CHAT_LOCAL_ECHOES=CHAT_LOCAL_ECHOES.filter(local=>
local.type!=type||local.target!=target||now-local.ts<120000
);

CHAT_LOCAL_ECHOES.forEach(local=>{
if(local.type!=type||local.target!=target)return;

if(local.pending){
serverRows.push(local);
return;
}

const match=serverRows.findIndex(item=>
String(item.from||'').toLowerCase()==String(local.from||'').toLowerCase() &&
String(item.text||'')==local.text &&
(Number(item.ts)||0)>=local.ts-5000 &&
(Number(item.ts)||0)<=local.ts+120000
);

if(match>=0){
return;
}

serverRows.push(local);
});

const unique=[];
const seen=new Set();
serverRows.forEach(item=>{
const key=String(item&&item.id||'');
if(key&&seen.has(key))return;
if(key)seen.add(key);
unique.push(item);
});

return unique.sort((a,b)=>
(Number(a.ts)||0)-(Number(b.ts)||0) ||
(Number(a.row)||0)-(Number(b.row)||0)
);

}


function chatFileSize(bytes){
const n=Number(bytes)||0;
if(!n)return '';
if(n<1024)return n+' B';
if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+' KB';
return (n/1048576).toFixed(n<10485760?1:0)+' MB';
}


function chatAttachmentAllowed(kind,mime){
mime=String(mime||'').toLowerCase().split(';')[0].trim();
if(kind=='image')return /^image\/(?:jpeg|png|webp|gif)$/.test(mime);
if(kind=='audio')return /^audio\/(?:webm|ogg|mp4|mpeg|mp3|wav|x-m4a|m4a)$/.test(mime);
return /^(?:application\/pdf|text\/plain|text\/csv|application\/msword|application\/vnd\.ms-excel|application\/vnd\.ms-powerpoint|application\/vnd\.openxmlformats-officedocument\.(?:wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)|application\/zip|application\/x-zip-compressed|application\/vnd\.rar)$/.test(mime);
}

function chatIcon(name,extraClass){
const svg=CHAT_ICONS[name]||'';
if(!extraClass)return svg;
return svg.replace('<svg','<svg class="'+extraClass+'"');
}


function chatMediaUrl(attachment,options){
const id=String(attachment&&attachment.id||'');
if(!id)return String(attachment&&attachment.url||'');
const params=new URLSearchParams({
id:id,
mime:String(attachment.mime||''),
name:String(attachment.name||'lampiran')
});
if(options&&options.download)params.set('dl','1');
return '/api/media?'+params.toString();
}


function chatImageError(img){
const fallback=img.getAttribute('data-fallback');
if(fallback&&img.getAttribute('src')!=fallback){
img.setAttribute('src',fallback);
img.removeAttribute('data-fallback');
return;
}
img.style.display='none';
const holder=img.closest('.chat-media-link')||img;
const note=holder.nextElementSibling;
if(note&&note.classList.contains('chat-image-fallback'))note.hidden=false;
}


let CHAT_EMOJI_RE=null;
try{CHAT_EMOJI_RE=/^(?:\p{Extended_Pictographic}|\p{Emoji_Modifier}|\u200d|\ufe0f|\s){1,18}$/u;}catch(e){}

function chatIsSticker(text){
const value=String(text||'').trim();
if(!value||!CHAT_EMOJI_RE||value.length>48)return false;
return CHAT_EMOJI_RE.test(value);
}


function chatLocationUrl(text){
const value=String(text||'').trim();
if(value.slice(0,2)!='📍')return '';
const match=/https:\/\/www\.google\.com\/maps\?q=-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?/i.exec(value);
return match?match[0]:'';
}


function chatLocationHtml(url){
const coords=(/[?&]q=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(url)||[]).slice(1);
const label=coords.length==2
?Number(coords[0]).toFixed(5)+', '+Number(coords[1]).toFixed(5)
:'Lokasi dibagikan';
return `<a class="chat-location" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
<span class="chat-location-icon">${chatIcon('pin')}</span>
<span class="chat-location-copy"><b>Lokasi saya</b><small>${esc(label)}</small></span>
<span class="chat-location-go">${chatIcon('arrow')}</span>
</a>`;
}


function chatHighlight(text,query){
const value=String(text||'');
if(!query)return esc(value);
const lower=value.toLowerCase();
const needle=String(query).toLowerCase();
let out='';
let index=0;
while(index<value.length){
const hit=lower.indexOf(needle,index);
if(hit<0){
out+=esc(value.slice(index));
break;
}
out+=esc(value.slice(index,hit))+'<mark>'+esc(value.slice(hit,hit+needle.length))+'</mark>';
index=hit+needle.length;
}
return out;
}

function chatMessageHtml(message){

const query=CHAT_SEARCH_QUERY;
let media='';
if(attachment){
const kind=String(attachment.kind||'file');
const proxied=chatMediaUrl(attachment);
if(kind=='image'){
const primary=proxied||String(attachment.url||'');
const fallback=proxied&&attachment.url&&attachment.url!=proxied?String(attachment.url):'';
const image=`<img class="chat-image" src="${esc(primary)}" alt="${esc(attachment.name||'Foto')}" loading="lazy" data-fallback="${esc(fallback)}" onerror="chatImageError(this)">`;

?`<a class="chat-media-link" href="${esc(proxied||attachment.openUrl)}" target="_blank" rel="noopener">${image}</a>${note}`
:`${image}${note}`;
}else if(kind=='audio'){

}else if(message.text){
body=sticker
?`<div class="chat-text chat-sticker-wrap"><span class="chat-sticker">${esc(message.text)}</span></div>`
:`<div class="chat-text">${chatHighlight(message.text,query)}</div>`;

return `<div class="chat-bubble ${mine?'mine':''}${sticker?' sticker':''}"${row?` data-msg-row="${row}"`:''}>
<div class="chat-bubble-author">${socialAvatar(message.nama,message.photoUrl,'social-avatar small')}<b>${chatHighlight(message.nama||message.from||'Anggota TPFX',query)}</b>${message.role?`<span class="role-mark role-${['BM','DM'].includes(String(message.role).toUpperCase())?String(message.role).toLowerCase():'other'}">${esc(message.role)}</span>`:''}</div>
${body}
${media}
${message.pending?'<time>Mengirim...</time>':`<time>${socialTime(message.ts)}</time>`}

function chatVnFormat(seconds){
const total=Math.max(0,Math.floor(Number(seconds)||0));
return Math.floor(total/60)+':'+String(total%60).padStart(2,'0');
}


function chatVnPauseOthers(current){
document.querySelectorAll('.chat-vn audio').forEach(audio=>{
if(audio==current)return;
if(!audio.paused)audio.pause();
});
}


function chatVnToggle(button){
const wrap=button.closest('.chat-vn');
if(!wrap)return;
const audio=wrap.querySelector('audio');
if(!audio)return;
if(audio.paused){
chatVnPauseOthers(audio);
const play=audio.play();
if(play&&play.catch)play.catch(()=>chatVnError(audio));
}else{
audio.pause();
}
}


function chatVnState(audio,playing){
const wrap=audio.closest('.chat-vn');
if(!wrap)return;
wrap.classList.toggle('playing',playing);
wrap.dataset.playing=playing?'1':'0';
}


function chatVnMeta(audio){
const wrap=audio.closest('.chat-vn');
if(!wrap)return;
const duration=wrap.querySelector('.chat-vn-dur');
const playing=wrap.querySelector('.chat-vn-btn');
if(duration&&Number.isFinite(audio.duration))duration.textContent=chatVnFormat(audio.duration);
if(playing)playing.setAttribute('aria-label','Putar pesan suara · '+chatVnFormat(audio.duration));
audio.dataset.ready='1';
}


function chatVnUpdate(audio){
const wrap=audio.closest('.chat-vn');
if(!wrap)return;
const bar=wrap.querySelector('.chat-vn-track i');
const time=wrap.querySelector('.chat-vn-time');
const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:0;
if(bar)bar.style.width=(duration?Math.min(100,audio.currentTime/duration*100):0)+'%';
if(time)time.textContent=chatVnFormat(audio.currentTime);
chatVnState(audio,!audio.paused);
}


function chatVnEnded(audio){
const wrap=audio.closest('.chat-vn');
if(!wrap)return;
chatVnState(audio,false);
const bar=wrap.querySelector('.chat-vn-track i');
const time=wrap.querySelector('.chat-vn-time');
if(bar)bar.style.width='100%';
if(time)time.textContent=chatVnFormat(audio.duration||audio.currentTime);
audio.currentTime=0;
wrap.dataset.ended='1';
}


function chatVnSeek(track,event){
const wrap=track.closest('.chat-vn');
if(!wrap)return;
const audio=wrap.querySelector('audio');
if(!audio)return;
const box=track.getBoundingClientRect();
const ratio=Math.max(0,Math.min(1,(event.clientX-box.left)/Math.max(1,box.width)));
const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:0;
if(!duration)return;
audio.currentTime=duration*ratio;
chatVnUpdate(audio);
}


function chatVnError(audio){
const wrap=audio.closest('.chat-vn');
if(!wrap)return;
const retry=audio.getAttribute('data-fallback');
if(retry&&audio.getAttribute('src')!=retry&&!audio.dataset.retried){
audio.dataset.retried='1';
audio.setAttribute('src',retry);
audio.load();
return;
}
chatVnState(audio,false);
const info=wrap.querySelector('.chat-vn-info');
if(info)info.innerHTML='<span class="chat-vn-error">Audio tidak dapat diputar</span><span class="chat-vn-dur">Unduh</span>';
}


function chatMatchesQuery(message,query){
if(!query)return true;
const needle=String(query).toLowerCase();
const haystack=[
message.text,
message.nama,
message.from,
message.attachment&&message.attachment.name
].filter(Boolean).join(' ').toLowerCase();
return haystack.indexOf(needle)>=0;
}


function chatMessagePreview(message){
if(message.text)return message.text;
if(message.attachment){
const kind=String(message.attachment.kind||'file');
if(kind=='image')return '📷 Foto';
if(kind=='audio')return '🎤 Pesan suara';
return '📎 '+String(message.attachment.name||'Lampiran');
}
return '(pesan kosong)';
}


function chatMessagesHtml(){
if(CHAT_HISTORY_LOADING&&!CHAT_MESSAGES.length){
return '<div class="chat-loading"><span></span>Memuat pesan…</div>';
}
const query=CHAT_SEARCH_QUERY;
if(query){
const matches=CHAT_MESSAGES.filter(message=>chatMatchesQuery(message,query));
const known=new Set(CHAT_MESSAGES.map(message=>String(message.id||'')));
const remote=CHAT_SEARCH_REMOTE.filter(message=>!known.has(String(message.id||'')));
let html=matches.map(chatMessageHtml).join('');
if(remote.length){
html+=`<div class="chat-search-group"><span>Dari riwayat lebih lama</span>${remote.map(message=>`<button type="button" class="chat-search-hit" onclick="chatOpenSearchResult(${Number(message.row)||0})"><b>${esc(message.nama||message.from)}</b><span>${chatHighlight(chatMessagePreview(message),query)}</span><time>${socialTime(message.ts)}</time></button>`).join('')}</div>`;
}
if(!html){
if(CHAT_SEARCH_LOADING)return '<div class="chat-loading"><span></span>Mencari riwayat…</div>';
return '<div class="empty">Tidak ada pesan yang cocok.</div>';
}
return html;
}
return (CHAT_HAS_MORE?'<button class="btn sec chat-load-older" type="button" onclick="loadOlderChat()">Muat pesan sebelumnya</button>':'')+CHAT_MESSAGES.map(chatMessageHtml).join('');
}


function renderChatMessages(){
const box=$('#chatPreview');
if(!box)return;
const active=box.querySelector('.chat-vn audio');
const vnState=active&&active.currentTime>0
?{src:active.getAttribute('src'),time:active.currentTime,playing:!active.paused}
:null;
box.innerHTML=chatMessagesHtml()||'<div class="empty">Mulai percakapan dengan menyapa anggota.</div>';
if(vnState){
const next=Array.from(box.querySelectorAll('.chat-vn audio')).find(audio=>audio.getAttribute('src')==vnState.src);
if(next){
const restore=()=>{try{next.currentTime=vnState.time;}catch(e){}};
if(next.readyState>=1)restore();else next.addEventListener('loadedmetadata',restore,{once:true});
if(vnState.playing){const play=next.play();if(play&&play.catch)play.catch(()=>{});chatVnState(next,true);}
}
}
}

function chatReadFile(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=()=>reject(new Error('File gagal dibaca.'));
reader.onload=()=>resolve(String(reader.result||''));
reader.readAsDataURL(file);
});
}


function chatCompressImage(file){
return new Promise(resolve=>{
const reader=new FileReader();
reader.onerror=()=>resolve('');
reader.onload=()=>{
const image=new Image();
image.onerror=()=>resolve('');
image.onload=()=>{
try{
const scale=Math.min(1,1400/image.width,1400/image.height);
const canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.width*scale));
canvas.height=Math.max(1,Math.round(image.height*scale));
const context=canvas.getContext('2d');
if(!context){resolve('');return;}
context.drawImage(image,0,0,canvas.width,canvas.height);
resolve(canvas.toDataURL('image/jpeg',.82));
}catch(e){
resolve('');
}
};
image.src=String(reader.result||'');
};
reader.readAsDataURL(file);
});
}


async function chatHandleFile(input){
const file=input.files&&input.files[0];
input.value='';
if(!file)return;
if(file.size>8*1024*1024){
toast('Ukuran lampiran maksimal 8 MB.');
return;
}
const rawKind=String(file.type||'').split('/')[0];
const kind=rawKind=='image'?'image':rawKind=='audio'?'audio':'file';
try{
let dataUrl='';
let mime=String(file.type||'application/octet-stream');
let name=String(file.name||'lampiran');
if(kind=='image'&&mime!='image/gif'){
dataUrl=await chatCompressImage(file);
if(dataUrl){
mime='image/jpeg';
name=name.replace(/\.[A-Za-z0-9]+$/,'')+'.jpg';
}
}
if(!dataUrl)dataUrl=await chatReadFile(file);
if(!dataUrl||dataUrl.indexOf('data:')!=0)throw new Error('File gagal dibaca.');
if(!chatAttachmentAllowed(kind,mime)){
toast('Jenis file ini belum didukung. Gunakan foto JPG/PNG/WEBP/GIF, audio, PDF, dokumen Office, TXT/CSV, atau ZIP.');
return;
}
CHAT_ATTACHMENT={
kind:kind,
dataUrl:dataUrl,
name:name,
mime:mime,
size:Math.round(dataUrl.length*3/4)
};
chatRenderAttachmentPreview();
}catch(e){
toast('Lampiran gagal dipilih: '+String((e&&e.message)||e));
}
}

function chatRecordTime(){

}

async function toggleChatRecording(){
if(CHAT_RECORDING){
stopChatRecording(false);
return;
}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){
toast('Browser ini belum mendukung rekaman suara.');
return;
}
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
const candidates=[
'audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus',
'audio/mp4','audio/mpeg'
];
const mime=candidates.find(type=>{
try{return MediaRecorder.isTypeSupported(type);}catch(e){return false;}
})||'';
const recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
CHAT_RECORDER=recorder;
CHAT_RECORD_CHUNKS=[];
CHAT_RECORD_STREAM=stream;
CHAT_RECORD_CANCEL=false;
CHAT_RECORD_STARTED=Date.now();
recorder.ondataavailable=event=>{
if(event.data&&event.data.size)CHAT_RECORD_CHUNKS.push(event.data);
};
recorder.onstop=()=>{
const chunks=CHAT_RECORD_CHUNKS.slice();
const canceled=CHAT_RECORD_CANCEL;
const recordedMime=String(recorder.mimeType||mime||'audio/webm').split(';')[0];
CHAT_RECORD_CHUNKS=[];
CHAT_RECORD_CANCEL=false;
if(canceled||!chunks.length)return;
const blob=new Blob(chunks,{type:recordedMime});
const reader=new FileReader();
reader.onerror=()=>toast('Rekaman gagal dibaca.');
reader.onload=()=>{
const dataUrl=String(reader.result||'');
if(!dataUrl)return;
const ext=recordedMime.indexOf('mp4')>=0?'m4a':
recordedMime.indexOf('ogg')>=0?'ogg':
recordedMime.indexOf('mpeg')>=0?'mp3':'webm';
CHAT_ATTACHMENT={
kind:'audio',
dataUrl:dataUrl,
name:'Pesan suara.'+ext,
mime:recordedMime,
size:blob.size
};
chatRenderAttachmentPreview();
toast('Rekaman siap dikirim.');
};
reader.readAsDataURL(blob);
};
recorder.start();
CHAT_RECORDING=true;
updateChatMicButton();
chatRenderAttachmentPreview();
CHAT_RECORD_TIMER=setInterval(()=>{
const label=$('#chatRecTime');
if(label)label.textContent=chatRecordTime();
},500);
setTimeout(()=>{
if(CHAT_RECORDING)stopChatRecording(false);
},120000);
}catch(e){
toast('Mikrofon tidak dapat diakses: '+String((e&&e.message)||e));
}
}


function stopChatRecording(cancel){
if(!CHAT_RECORDING||!CHAT_RECORDER){
CHAT_RECORDING=false;
if(CHAT_RECORD_TIMER){clearInterval(CHAT_RECORD_TIMER);CHAT_RECORD_TIMER=null;}
updateChatMicButton();
return;
}
const elapsed=Date.now()-CHAT_RECORD_STARTED;
CHAT_RECORD_CANCEL=!!cancel||elapsed<700;
CHAT_RECORDING=false;
if(CHAT_RECORD_TIMER){clearInterval(CHAT_RECORD_TIMER);CHAT_RECORD_TIMER=null;}
try{CHAT_RECORDER.stop();}catch(e){}
CHAT_RECORDER=null;
if(CHAT_RECORD_STREAM){
try{CHAT_RECORD_STREAM.getTracks().forEach(track=>track.stop());}catch(e){}
CHAT_RECORD_STREAM=null;
}
if(elapsed<700&&!cancel)toast('Rekaman terlalu pendek, coba lagi.');
updateChatMicButton();
chatRenderAttachmentPreview();
}

async function refreshChatHistory(){

if(!(tab=='chat'||dmTab=='chat')||!CHAT_ACTIVE||CHAT_HISTORY_LOADING||CHAT_SYNC_LOADING||CHAT_SENDING||CHAT_UPLOADING)return;
if(document.visibilityState=='hidden')return;

CHAT_SYNC_LOADING=true;
const type=CHAT_ACTIVE.type;
const target=CHAT_ACTIVE.id;
const cursor=CHAT_SYNC_CURSOR;

try{
const r=await rpc('chatSync',TOK,type,target,cursor);

if(!r||typeof r!='object')throw new Error('Format respons riwayat chat tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Tidak dapat memuat pesan');
}
if(!Array.isArray(r.rows))throw new Error('Endpoint riwayat chat harus mengembalikan rows berupa array.');
if(!Number.isFinite(Number(r.cursor))||Number(r.cursor)<cursor)throw new Error('Cursor sinkronisasi chat tidak valid.');
if(!CHAT_ACTIVE||CHAT_ACTIVE.type!=type||CHAT_ACTIVE.id!=target||CHAT_SYNC_CURSOR!=cursor)return;

const box=$('#chatPreview');
const shouldScroll=!box||box.scrollHeight-box.scrollTop-box.clientHeight<60;
CHAT_SYNC_CURSOR=Number(r.cursor);
if(r.rows.length)CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES.concat(r.rows),type,target);
if(r.rows.length)writeChatCache(type,target,CHAT_MESSAGES);
if((tab=='chat'||dmTab=='chat')&&document.visibilityState!='hidden'){
markChatSeen(type,target,CHAT_MESSAGES.reduce((latest,message)=>Math.max(latest,Number(message.ts)||0),0));
updateChatNavBadge();
}
if(box&&r.rows.length){
renderChatMessages();
if(shouldScroll)scrollChatToBottom();
}
}catch(e){
if(Date.now()-CHAT_SYNC_ERROR_AT>30000){
CHAT_SYNC_ERROR_AT=Date.now();
toast('Chat gagal diperbarui: '+String((e&&e.message)||e));
}
}finally{
CHAT_SYNC_LOADING=false;
}

}

async function sendTeamMessage(event){

event.preventDefault();
if(CHAT_SENDING)return;
const input=$('#chatText');
const text=input.value.trim();
const draft=CHAT_ATTACHMENT;
if(!CHAT_ACTIVE||(!text&&!draft))return;

const target=CHAT_ACTIVE.id;
const type=CHAT_ACTIVE.type;
const local={
id:'local-message-'+Date.now()+'-'+Math.random().toString(36).slice(2),
from:USER,
nama:S.name,
text:text,
ts:Date.now(),
pending:true,
type:type,
target:target,
attachment:draft?{
kind:draft.kind,
name:draft.name,
size:draft.size,
url:draft.dataUrl
}:null
};

CHAT_LOCAL_ECHOES.push(local);
CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES,type,target);
input.value='';
CHAT_SENDING=true;
const submit=input.form&&input.form.querySelector('[type="submit"]');
if(submit)submit.disabled=true;
renderChatMessages();
scrollChatToBottom();

try{
let uploaded=null;
if(draft){
CHAT_UPLOADING=true;
const status=$('#chatAttachPreview');
if(status)status.innerHTML='<div class="chat-uploading">Mengunggah '+esc(chatAttachmentLabel(draft))+'…</div>';
const up=await rpcLong('uploadChatFile',TOK,draft.dataUrl,draft.name,draft.mime);
if(!up||typeof up!='object')throw new Error('Respons upload lampiran tidak valid.');
if(up.err){
if(up.err=='AUTH'){logout();return;}
throw new Error(typeof up.err=='string'?up.err:'Lampiran gagal diunggah');
}
if(up.ok!==1||!up.file||!up.file.id)throw new Error('Server tidak mengembalikan data lampiran.');
uploaded=up.file;
local.attachment=chatAttachmentFromUpload(uploaded);
if(CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&CHAT_ACTIVE.id==target)renderChatMessages();
}
CHAT_UPLOADING=false;

const r=await rpc(
type=='group'?'sendGroupChat':type=='global'?'sendGlobalChat':'sendChat',
TOK,
target,
text,
uploaded
);
if(!r||typeof r!='object')throw new Error('Format respons pengiriman pesan tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Pesan gagal dikirim');
}
if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi pengiriman pesan.');

const preview=text||chatAttachmentLabel(uploaded);
local.pending=false;
if(type=='group'){
const group=CHAT_GROUPS.find(item=>String(item.id)==target);
if(group){group.lastText=preview;group.lastTs=local.ts;group.lastFrom=USER;}
}else if(type=='personal'){
const contact=CHAT_CONTACTS.find(item=>String(item.username)==target);
if(contact){contact.lastText=preview;contact.lastTs=local.ts;contact.lastFrom=USER;}
}else if(CHAT_GLOBAL){
CHAT_GLOBAL.lastText=preview;CHAT_GLOBAL.lastTs=local.ts;CHAT_GLOBAL.lastFrom=USER;
}
markChatSeen(type,target,local.ts);

const listSelector=type=='group'?'[data-group]':type=='global'?'[data-global]':'[data-username]';
Array.from(document.querySelectorAll(listSelector)).forEach(button=>{
const key=type=='group'?button.dataset.group:type=='global'?'global':button.dataset.username;
if(String(key)!=target)return;
const contactPreview=button.querySelector('.chat-contact-copy span');
if(contactPreview)contactPreview.textContent=preview;
});

CHAT_ATTACHMENT=null;
chatRenderAttachmentPreview();
if(CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&CHAT_ACTIVE.id==target){
CHAT_MESSAGES=mergeChatRows(CHAT_MESSAGES,type,target);
writeChatCache(type,target,CHAT_MESSAGES);
renderChatMessages();
scrollChatToBottom();
}

toast('Pesan terkirim');
}catch(e){
CHAT_LOCAL_ECHOES=CHAT_LOCAL_ECHOES.filter(item=>item.id!=local.id);
if(CHAT_ACTIVE&&CHAT_ACTIVE.type==type&&CHAT_ACTIVE.id==target){
CHAT_MESSAGES=CHAT_MESSAGES.filter(item=>item.id!=local.id);
renderChatMessages();
if(input&&!input.value)input.value=text;
}
toast('Pesan gagal dikirim: '+String((e&&e.message)||e));
}finally{
CHAT_UPLOADING=false;
CHAT_SENDING=false;
if(submit&&submit.isConnected)submit.disabled=false;
chatRenderAttachmentPreview();
}

}

const GOLD_NEWS_TTL=2*60*1000;
const GOLD_NEWS_FAIL_MS=3*60*1000;

function fmtGoldPrice(value){
return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function normalizeNewsItem(item){
const url=String(item&&item.url||'');
if(!/^https?:\/\//i.test(url))return null;
const title=String(item.title||'').replace(/\s+/g,' ').trim().slice(0,180);
if(!title)return null;
const source=String(item.source||'Gold News').replace(/\s+/g,' ').trim().slice(0,60)||'Gold News';
return{title,url,source,ts:Number(item.ts)||0};
}

function restoreGoldNews(){
try{
const raw=JSON.parse(localStorage.getItem('tpfx_gold_news')||'null');
if(!raw||typeof raw!='object')return;
if(Array.isArray(raw.items))GOLD_NEWS=raw.items.map(normalizeNewsItem).filter(Boolean).slice(0,6);
GOLD_NEWS_AT=Number(raw.at)||0;
GOLD_PRICE=Number(raw.price)||0;
GOLD_PRICE_UPDATED=Number(raw.priceUpdated)||0;
}catch(e){}
}

async function loadGoldNews(force){
if(!TOK||GOLD_NEWS_LOADING)return;
const now=Date.now();
if(!force&&GOLD_NEWS_AT&&now-GOLD_NEWS_AT<GOLD_NEWS_TTL)return;
if(!force&&GOLD_NEWS_FAIL_AT&&now-GOLD_NEWS_FAIL_AT<GOLD_NEWS_FAIL_MS)return;
GOLD_NEWS_LOADING=true;
let timer=null;
try{
const controller=typeof AbortController!='undefined'?new AbortController():null;
if(controller)timer=setTimeout(()=>controller.abort(),8000);
const response=await fetch('/api/news',{
headers:{Accept:'application/json'},
cache:'no-store',
signal:controller?controller.signal:undefined
});
if(!response.ok)throw new Error('HTTP '+response.status);
const data=await response.json();
const list=data&&Array.isArray(data.items)?data.items.map(normalizeNewsItem).filter(Boolean).slice(0,6):[];
const price=Number(data&&data.price&&data.price.value)||0;
if(!list.length&&!price)throw new Error('Berita dan harga kosong');
let changed=false;
if(list.length){
GOLD_NEWS=list;
GOLD_NEWS_AT=Date.now();
changed=true;
}
if(price>0){
GOLD_PRICE=price;
GOLD_PRICE_UPDATED=Number(data.price&&data.price.updated)||Date.now();
GOLD_NEWS_AT=Date.now();
changed=true;
}
GOLD_NEWS_FAIL_AT=0;
try{
localStorage.setItem('tpfx_gold_news',JSON.stringify({at:GOLD_NEWS_AT,items:GOLD_NEWS,price:GOLD_PRICE,priceUpdated:GOLD_PRICE_UPDATED}));
}catch(e){}
if(changed)refreshDepositTicker();
}catch(e){
GOLD_NEWS_FAIL_AT=Date.now();
}finally{
if(timer)clearTimeout(timer);
GOLD_NEWS_LOADING=false;
}
}

function depositTicker(){
loadGoldNews();
const items=[];
const add=(lead,by)=>{
if(!lead||String(lead.status)!='deal')return;
const note=String(lead.notes||'');
const amount=(note.match(/rp\.?\s*([\d][\d.,]*)/i)||[])[1]||'';
items.push({
by:String(by||''),
amount:amount,
ts:Date.parse(lead.last||lead.c)||0
});
};
if(ROLE=='DM'||ROLE=='BM'){
(TEAM||[]).forEach(member=>{
const leads=member&&member.state&&member.state.leads||[];
leads.forEach(lead=>add(lead,member.nama||member.user));
});
}else{
(S.leads||[]).forEach(lead=>add(lead,S.name||USER));
}
items.sort((a,b)=>b.ts-a.ts);
const deposits=items.slice(0,5).map(item=>
`<span class="deposit-ticker-item"><b>${esc(item.by||'BDO')}</b><span class="deposit-ticker-sep">·</span><span class="deposit-ticker-amount">${item.amount?'Rp'+esc(item.amount):'Closing baru'}</span></span>`
);
const newsItems=GOLD_NEWS.slice(0,6);
const newsRow=(item,duplicate)=>
duplicate
?`<a class="deposit-ticker-item deposit-ticker-news" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="${esc(item.title)}" tabindex="-1"><span class="deposit-ticker-tag">XAUUSD</span><span class="deposit-ticker-news-title">${esc(item.title)}</span>${item.source?`<span class="deposit-ticker-sep">·</span><span class="deposit-ticker-source">${esc(item.source)}</span>`:''}</a>`
:item.url
?`<a class="deposit-ticker-item deposit-ticker-news" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" title="${esc(item.title)}"><span class="deposit-ticker-tag">XAUUSD</span><span class="deposit-ticker-news-title">${esc(item.title)}</span>${item.source?`<span class="deposit-ticker-sep">·</span><span class="deposit-ticker-source">${esc(item.source)}</span>`:''}</a>`
:`<span class="deposit-ticker-item deposit-ticker-news"><span class="deposit-ticker-tag">XAUUSD</span><span class="deposit-ticker-news-title">${esc(item.title)}</span>${item.source?`<span class="deposit-ticker-sep">·</span><span class="deposit-ticker-source">${esc(item.source)}</span>`:''}</span>`;
const build=(duplicate)=>deposits.concat(newsItems.map(item=>newsRow(item,duplicate)));
const first=build(false);
const second=build(true);
if(!first.length){
const empty='<span class="deposit-ticker-item deposit-ticker-empty">Belum ada deposit atau berita emas — jemput closing berikutnya!</span>';
first.push(empty);
second.push(empty);
}
const mobile=typeof matchMedia=='function'&&matchMedia('(max-width:640px)').matches;
let chars=0;
items.slice(0,5).forEach(item=>{
chars+=String(item.by||'BDO').length+String(item.amount||'Closing baru').length+10;
});
newsItems.forEach(item=>{
chars+=6+String(item.title||'').length+(mobile?0:String(item.source||'').length)+12;
});
const doubled=`<span class="deposit-ticker-group">${first.join('')}</span><span class="deposit-ticker-group" aria-hidden="true">${second.join('')}</span>`;
const estimated=chars*6.4+first.length*40;
const duration=Math.max(24,Math.min(96,estimated/42));
const updatedLabel=GOLD_PRICE_UPDATED?new Date(GOLD_PRICE_UPDATED).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
const market=GOLD_PRICE>0
?`<span class="deposit-ticker-market" title="Harga XAUUSD live${updatedLabel?' · '+updatedLabel:''}"><span class="deposit-ticker-symbol">XAUUSD</span><b class="deposit-ticker-price">${fmtGoldPrice(GOLD_PRICE)}</b><span class="deposit-ticker-live"><i></i>LIVE</span></span>`
:'<span class="deposit-ticker-caption">Closing &amp; berita emas</span>';
return`<div class="deposit-ticker" id="depositTicker" role="region" aria-label="Closing terbaru, harga dan berita emas XAUUSD" title="Closing terbaru, harga & berita emas XAUUSD">
<div class="deposit-ticker-head">
<span class="deposit-ticker-label">UPDATE</span>
${market}
</div>
<div class="deposit-ticker-window">
<div class="deposit-ticker-track" style="animation-duration:${duration.toFixed(1)}s">
${doubled}
</div>
</div>
</div>`;
}

function fileSlug(value){
return String(value||'data')
.toLowerCase()
.replace(/[^a-z0-9]+/g,'-')
.replace(/^-+|-+$/g,'')
.slice(0,40)||'data';
}


function downloadCsvRows(filename,rows){
const csv='\ufeff'+rows.map(row=>
row.map(value=>'"'+String(value==null?'':value).replace(/"/g,'""')+'"').join(',')
).join('\r\n');
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
a.download=filename;
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}


function loadSheetJs(){
if(window.XLSX)return Promise.resolve(window.XLSX);
if(!window.__tpfxXlsx){
window.__tpfxXlsx=new Promise((resolve,reject)=>{
const script=document.createElement('script');
script.src='./vendor/xlsx.full.min.js';
script.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error('Pustaka Excel tidak siap.'));
script.onerror=()=>reject(new Error('Pustaka Excel gagal dimuat.'));
document.head.appendChild(script);
});
}
return window.__tpfxXlsx;
}


async function exportRows(format,filenameBase,sheetName,rows){
if(!Array.isArray(rows)||rows.length<2){
toast('Tidak ada data untuk diekspor.');
return;
}
const name=filenameBase+'-'+iso(0);
if(format=='xlsx'){
try{
const XLSX=await loadSheetJs();
const sheet=XLSX.utils.aoa_to_sheet(rows);
sheet['!cols']=rows[0].map((unused,index)=>({
wch:Math.min(44,Math.max(10,...rows.slice(0,200).map(row=>String(row[index]==null?'':row[index]).length+2)))
}));
const book=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(book,sheet,String(sheetName||'Data').slice(0,30));
XLSX.writeFile(book,name+'.xlsx',{compression:true});
toast('File Excel diunduh.');
}catch(e){
console.warn('Ekspor Excel gagal:',e);
downloadCsvRows(name+'.csv',rows);
toast('Excel tidak tersedia, file CSV diunduh.');
}
return;
}
downloadCsvRows(name+'.csv',rows);
toast('File CSV diunduh.');
}

function pick(el){

const f=
el.files[0];

if(!f)return;


const r=
new FileReader();


r.onload=()=>{

const i=
new Image();


i.onload=()=>{

const c=
document.createElement(
'canvas'
);

const s=
Math.min(
1,
700/i.width
);

c.width=
i.width*s;

c.height=
i.height*s;


c.getContext(
'2d'
).drawImage(
i,
0,
0,
c.width,
c.height
);


img=
c.toDataURL(
'image/jpeg',
.6
);


$('#pv').src=
img;

$('#pv')
.style.display=
'block';

};


i.src=
r.result;

};


r.readAsDataURL(f);

}

function prepareProfilePhoto(input){
const file=input.files&&input.files[0];
if(!file)return;
if(!file.type.startsWith('image/')){toast('Pilih file gambar.');input.value='';return;}
if(file.size>8*1024*1024){toast('Ukuran foto maksimal 8 MB.');input.value='';return;}
const reader=new FileReader();
reader.onerror=()=>toast('Foto profil gagal dibaca.');
reader.onload=()=>{
const image=new Image();
image.onerror=()=>toast('Format foto profil tidak dapat dibuka.');
image.onload=()=>{
const side=512,scale=Math.min(1,side/image.width,side/image.height);
const canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.width*scale));
canvas.height=Math.max(1,Math.round(image.height*scale));
const context=canvas.getContext('2d');
if(!context){toast('Browser tidak dapat memproses foto profil.');return;}
context.drawImage(image,0,0,canvas.width,canvas.height);
PROFILE_PHOTO_DRAFT=canvas.toDataURL('image/jpeg',.8);
render();
};
image.src=String(reader.result||'');
};
reader.readAsDataURL(file);
}

async function saveProfilePhoto(){
if(!PROFILE_PHOTO_DRAFT)return;
try{
toast('Mengunggah foto profil...');
const url=await rpc('uploadImg',TOK,PROFILE_PHOTO_DRAFT);
if(typeof url!='string'||!/^https?:\/\//i.test(url))throw new Error('Server tidak mengembalikan tautan foto yang valid.');
const result=await rpc('updateProfilePhoto',TOK,url);
if(!result||result.ok!==1)throw new Error(result&&result.err||'Foto profil gagal disimpan.');
PROFILE_PHOTO=url;
PROFILE_PHOTO_DRAFT='';
renderAppHeader();
render();
toast('Foto profil diperbarui.');
}catch(e){
if(isAuthError(e)){logout('Sesi login berakhir. Silakan login kembali.');return;}
toast('Foto profil gagal disimpan: '+String((e&&e.message)||e));
}
}

async function saveBDOTarget(username){

const input=$('#bdoTarget');
const target=Number(input.value);

if(!Number.isInteger(target)||target<1||target>1000){
toast('Target harus berupa bilangan bulat antara 1 sampai 1000');
return;
}

try{
const r=await rpc('updateBDOTarget',TOK,username,target);
if(!r||typeof r!='object')throw new Error('Format respons updateBDOTarget tidak valid.');
if(r.err){
if(r.err=='AUTH'){logout();return;}
throw new Error(typeof r.err=='string'?r.err:'Target gagal disimpan');
}
if(r.ok!==1)throw new Error('Apps Script belum mengonfirmasi perubahan target.');

const member=TEAM.find(item=>String(item.m.user).toLowerCase()==String(username).toLowerCase());
if(member)member.m.state.target=target;
render();
toast('Target aktivitas BDO diperbarui');
}catch(e){
toast('Target gagal disimpan: '+String((e&&e.message)||e));
}

}
